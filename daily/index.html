<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dagens Hiku</title>
<meta name="description" content="Dagens Hiku: fire nye tallbrett hver dag, fra lett til ekspert. Tallet sier hvor langt det hopper.">
<link rel="icon" href="../icon.png">
<meta property="og:title" content="Hiku">
<meta property="og:description" content="Four new boards every day. The number says how far it jumps.">
<meta property="og:image" content="https://hikupuzzle.com/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f3eee6;--ink:#2b2f45;--muted:#5a5d6f;--well:#e7e1d6;--cell:#ddd6ca;--tile:#fffaf2;--edge:#cbc2b3;--accent:#3b4a7a;--on-accent:#f3eee6;--soft:#dfe4f4;--guide:#6874a3;--gold:#a86e0e;--gold-bright:#e0a43a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d27;--ink:#ecebf2;--muted:#bdbfcc;--well:#252836;--cell:#2d3040;--tile:#454b64;--edge:#161822;--accent:#9fb0ea;--on-accent:#1b1d27;--soft:#505d93;--guide:#c0ccf7;--gold:#f2c66d;--gold-bright:#f2c66d}}
:root[data-theme="dark"]{--bg:#1b1d27;--ink:#ecebf2;--muted:#bdbfcc;--well:#252836;--cell:#2d3040;--tile:#454b64;--edge:#161822;--accent:#9fb0ea;--on-accent:#1b1d27;--soft:#505d93;--guide:#c0ccf7;--gold:#f2c66d;--gold-bright:#f2c66d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:400 30px/1.1 Georgia,serif;margin:0;letter-spacing:-.5px}
h1 .arc{display:inline-block;width:1.1em;height:.62em;margin-left:.02em;vertical-align:baseline;overflow:visible}
.day{color:var(--muted);font-size:14px}
.rule{color:var(--muted);font-size:14px;margin:6px 0 14px}
.compact header,.compact .rule{display:none}
.compact main{padding-top:16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--cell);border:0;border-radius:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs .mark{font-size:12px;line-height:1;opacity:.8;min-height:12px}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--well);border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:absolute;border-radius:16%;background:var(--cell)}
.tile{position:absolute;z-index:1;border-radius:16%;background:var(--tile);box-shadow:0 3px 0 var(--edge);display:flex;align-items:center;justify-content:center;font-weight:500;font-variant-numeric:tabular-nums;cursor:grab;transition:transform .2s,opacity .4s,background .2s;border:0;color:var(--ink);padding:0;font-family:inherit}
.tile .dots{position:absolute;bottom:10%;left:0;right:0;display:flex;justify-content:center;gap:2px;opacity:.35}
.tile .dots i{border-radius:50%;background:currentColor;display:block}
.tile.sel{background:var(--accent);color:var(--on-accent)}
/* A good place to start: a gold ring that breathes, still for anyone who asked for less motion. */
.tile.hint::after{content:'';position:absolute;inset:-6px;border:3px solid var(--gold-bright);border-radius:20%;pointer-events:none;animation:breathe 1.4s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.55;box-shadow:0 0 3px var(--gold-bright)}to{opacity:1;box-shadow:0 0 12px var(--gold-bright)}}
@media (prefers-reduced-motion:reduce){.tile.hint::after{animation:none;opacity:1}}
.tile.target{background:var(--soft);outline:3px solid var(--guide);outline-offset:3px}
.tile.lifted{z-index:5;box-shadow:0 10px 20px rgba(0,0,0,.2);transition:none;cursor:grabbing}
.tile:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px}
.lost .tile{opacity:.45}
svg.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.eq{position:absolute;z-index:6;background:var(--accent);color:var(--on-accent);font-weight:600;padding:6px 12px;border-radius:10px;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;transition:opacity .3s}
.status{min-height:48px;margin:12px 0 8px;font-size:15px;display:flex;align-items:center;gap:10px}
.status.warn{background:var(--soft);border-radius:12px;padding:10px 14px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer}
.pill.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill:disabled{opacity:.35;cursor:default}
.lesson{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.lesson .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.lesson .tip{margin-top:4px}
.linky{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.info{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 2px 8px}
.done{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:18px;
  background:color-mix(in srgb,var(--well) 86%,transparent);animation:settle .45s ease .25s both}
.done .stars,.done .streak{justify-content:center}
.done .more{max-width:24em}
@keyframes settle{from{opacity:0}to{opacity:1}}
.stars{display:flex;gap:8px;font-size:32px;line-height:1;color:var(--gold-bright)}
.stars span{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.stars span.off{color:var(--muted);opacity:.6}
.stars.glow span{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both,glow 2.2s ease-in-out .9s infinite alternate}
.rtitle{font:400 28px/1.2 Georgia,serif;margin:10px 0 2px;color:var(--ink)}
.rdetail{color:var(--muted);font-size:14px}
.streak{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-top:6px;color:var(--ink)}
.streak svg{color:var(--gold-bright)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{from{text-shadow:0 0 4px rgba(224,164,58,.4)}to{text-shadow:0 0 16px rgba(224,164,58,.95)}}
.tile.land{animation:land .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{from{transform:scale(.72)}to{transform:scale(1)}}
.ghost{position:absolute;border-radius:16%;background:var(--tile);box-shadow:0 3px 0 var(--edge);pointer-events:none;animation:vanish .3s ease-in forwards;z-index:2}
@keyframes vanish{to{transform:scale(.3);opacity:0}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold-bright);pointer-events:none;z-index:7;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
footer{margin-top:18px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--accent)}
.app{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;border:1px solid var(--edge);border-radius:999px;padding:6px 12px}
.more{margin-top:8px;font-size:14px;color:var(--muted)}
.more a{color:var(--accent);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      boardEl.appendChild(b);
    });
    if (selected !== null) drawGuides(selected, L);
    if (lastMove) showSum(lastMove, L);
    renderStatus();
    renderControls();
  }

  // Dashed arcs from the picked number to where it can land, stopping at the tile edges.
  function drawGuides(from, L) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'guides');
    boardEl.appendChild(svg);
    const c = i => { const p = L.at(i); return {x: p.x + L.side / 2, y: p.y + L.side / 2}; };
    for (const to of targets(cells, n, from)) {
      const s = c(from), e = c(to), dist = Math.hypot(e.x - s.x, e.y - s.y), lift = dist * 0.28;
      const m = {x: (s.x + e.x) / 2, y: (s.y + e.y) / 2};
      const ctrl = s.x === e.x ? {x: m.x - lift, y: m.y} : {x: m.x, y: m.y - lift};
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', `M${s.x},${s.y} Q${ctrl.x},${ctrl.y} ${e.x},${e.y}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--guide)');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-dasharray', '5 6');
      svg.appendChild(path);
      // Only the part between the two tiles is drawn: the curve is traced from half a tile past the start to half a
      // tile before the end, so the dashes run evenly and never cover a number.
      const len = path.getTotalLength(), cut = Math.min(len * 0.45, L.side * 0.62), points = [];
      for (let k = 0; k <= 24; k++) { const pt = path.getPointAtLength(cut + (len - 2 * cut) * k / 24); points.push(`${pt.x.toFixed(1)},${pt.y.toFixed(1)}`); }
      path.setAttribute('d', 'M' + points.join(' L'));
    }
    boardEl.appendChild(svg);
  }

  const equation = m => m.a === m.b ? T.gone(m.a, m.b) : `${Math.max(m.a, m.b)} − ${Math.min(m.a, m.b)} = ${Math.abs(m.a - m.b)}`;
  // Spoken right away, ahead of the status line, so a move is heard as it is made.
  function say(text) { const el = document.getElementById('said'); el.textContent = ''; setTimeout(() => { el.textContent = text; }, 30); }

  function showSum(m, L) {
    const p = L.at(m.to), eq = document.createElement('div');
    eq.className = 'eq';
    eq.textContent = equation(m);
    eq.setAttribute('aria-hidden', 'true');
    Object.assign(eq.style, {left: p.x + L.side / 2 + 'px', top: Math.max(34, p.y - 6) + 'px'});
    boardEl.appendChild(eq);
    const shown = m;
    setTimeout(() => { if (lastMove === shown) { eq.style.opacity = 0; setTimeout(() => eq.remove(), 350); } }, 1100);
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    for (const t of TIERS) {
      const b = document.createElement('button');
      const done = store.get(resultKey(t));
      b.setAttribute('aria-pressed', t === tier);
      b.setAttribute('aria-label', T.tiers[t] + (done ? `, ${done}/3 ★` : ''));
      b.innerHTML = `<span aria-hidden="true">${T.tiers[t]}</span><span class="mark" aria-hidden="true">${done ? '★'.repeat(done) : ''}</span>`;
      b.onclick = () => { if (t !== tier) { start(t); say(`${T.title}, ${T.tiers[t]}. ${sentence(T.left(remaining()))}`); } };
      tabsEl.appendChild(b);
    }
  }

  function renderStatus() {
    statusEl.className = 'status';
    if (isClear(cells)) {
      const k = stars(undos), days = lesson === null ? streak() : 0;
      // The result lies on the cleared board, so the box keeps its height from the first move to the last.
      statusEl.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'done';
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label', T.resultSaid(k, resultTitle(), resultDetail()));
      const flame = '<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path fill="currentColor" d="M7 0c.6 2.6 3.9 4.2 3.9 8.3A3.9 3.9 0 0 1 7 12.2c-1.2 0-2.3-.6-2.9-1.5-.5 1.2-.3 2.5.4 3.5C2.3 13.6 1 11.6 1 9.4 1 5.5 5.6 4.3 7 0z"/></svg>';
      box.innerHTML = `<div class="stars${k === 3 && !reduced ? ' glow' : ''}" aria-hidden="true">` +
        [0, 1, 2].map(j => `<span class="${j < k ? '' : 'off'}" style="animation-delay:${reduced ? 0 : .15 + j * .18}s">${j < k ? '★' : '☆'}</span>`).join('') + '</div>' +
        `<div class="rtitle" aria-hidden="true">${resultTitle()}</div><div class="rdetail" aria-hidden="true">${resultDetail()}</div>` +
        (days > 0 ? `<div class="streak">${flame}${T.streak(days)}</div>` : '') +
        (lesson === null ? `<div class="more">${T.more} <a href="${APP_URL}" target="_blank" rel="noopener">${T.moreLink}</a></div>` : '');
      boardEl.appendChild(box);
    } else if (lost) {
      statusEl.className = 'status warn';
      statusEl.textContent = hasMove(cells, n) ? T.lost : T.stuck;
    } else if (!history.length && selected === null && lesson === null) {
      statusEl.textContent = T.start;
    } else if (selected !== null && !targets(cells, n, selected).length) {
      statusEl.textContent = T.noMove(cells[selected]);
    } else if (selected !== null) {
      statusEl.textContent = T.pick;
    } else {
      statusEl.textContent = '';
    }
  }

  // The buttons are kept between redraws and only updated. A redraw can land while a button is being pressed (the
  // lost-board check answering, or the frame resizing); a new button there would swallow the click.
  function renderControls() {
    let used = 0;
    const add = (label, fn, primary, disabled) => {
      let b = controlsEl.children[used];
      if (!b) { b = document.createElement('button'); controlsEl.appendChild(b); }
      used++;
      b.className = 'pill' + (primary ? ' primary' : '');
      if (b.textContent !== label) b.textContent = label;
      b.onclick = fn; b.disabled = !!disabled;
      return b;
    };
    fillControls(add);
    while (controlsEl.children.length > used) controlsEl.lastChild.remove();
  }

  function fillControls(add) {
    if (isClear(cells) && lesson !== null) {
      const last = lesson === LESSONS.length - 1;
      add(last ? T.toDaily : T.next, () => last ? endLessons() : startLesson(lesson + 1), true);
      if (stars(undos) < 3) add(T.retry, () => startLesson(lesson));
    } else if (isClear(cells)) {
      const share = add(T.share, async () => {
        const text = `Hiku · ${T.tiers[tier]} · ${now.toLocaleDateString(T.locale, {day: 'numeric', month: 'short'})}\n${'★'.repeat(stars(undos))}${'☆'.repeat(3 - stars(undos))}\n${location.origin}${location.pathname}`;
        try {
          if (navigator.share) await navigator.share({text});
          else { await navigator.clipboard.writeText(text); share.textContent = T.copied; }
        } catch {}
      }, true);
      if (stars(undos) < 3) add(T.retry, () => { start(tier); say(`${T.title}, ${T.tiers[tier]}. ${sentence(T.left(remaining()))}`); });
    } else {
      add(T.undo, undo, lost, !history.length);
      add(T.restart, restart, false, !history.length);
    }
  }

  // ---- Input: tap a number then its target, or drag it there.
  let drag = null;
  boardEl.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if (!tile || lost) return;
    drag = {i: +tile.dataset.i, el: tile, x: e.clientX, y: e.clientY, moved: false};
    tile.setPointerCapture(e.pointerId);
  });
  boardEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 6) return;
    if (!drag.moved) {
      drag.moved = true;
      selected = drag.i; lastMove = null;
      render();
      drag.el = boardEl.querySelector(`.tile[data-i="${drag.i}"]`);
      drag.el.classList.add('lifted');
    }
    drag.el.style.transform = `translate(${dx}px,${dy}px) scale(1.06)`;
    // Over a number it can land on, the sum shows above the lifted number, as in the app.
    const r = boardEl.getBoundingClientRect(), L = layout(), x = e.clientX - r.left, y = e.clientY - r.top;
    const over = cells.findIndex((_, i) => { const p = L.at(i); return x >= p.x && x <= p.x + L.side && y >= p.y && y <= p.y + L.side; });
    let eq = boardEl.querySelector('.eq.dragging');
    if (over >= 0 && targets(cells, n, drag.i).includes(over)) {
      if (!eq) { eq = document.createElement('div'); eq.className = 'eq dragging'; eq.setAttribute('aria-hidden', 'true'); boardEl.appendChild(eq); }
      eq.textContent = equation({a: cells[drag.i], b: cells[over]});
      const p = L.at(drag.i);
      Object.assign(eq.style, {left: p.x + L.side / 2 + dx + 'px', top: Math.max(34, p.y + dy - 6) + 'px'});
    } else if (eq) {
      eq.remove();
    }
  });
  // The board is redrawn only once the touch has ended. Redrawn while the finger is still lifting, the number under
  // it is gone before iOS delivers the end of the touch, and iOS then swallows the next tap whole: a button or a
  // number needed two. A touch waits for its touchend, which some browsers send well after pointerup; a mouse or pen
  // goes on at once.
  let afterTouch = null;
  document.addEventListener('touchend', () => { const run = afterTouch; afterTouch = null; if (run) setTimeout(run); }, true);
  function whenLifted(e, run) {
    if (e.pointerType !== 'touch') { run(); return; }
    afterTouch = run;
    setTimeout(() => { if (afterTouch === run) { afterTouch = null; run(); } }, 250);
  }
  boardEl.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved) { whenLifted(e, () => tap(d.i)); return; }
    const r = boardEl.getBoundingClientRect(), L = layout();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const over = cells.findIndex((_, i) => { const p = L.at(i); return x >= p.x && x <= p.x + L.side && y >= p.y && y <= p.y + L.side; });
    whenLifted(e, () => { if (over < 0 || !play(d.i, over, true)) { selected = null; render(); } });
  });
  boardEl.addEventListener('pointercancel', () => { drag = null; selected = null; render(); });

  // Enter or space on a focused number, for keyboards and screen readers.
  boardEl.addEventListener('click', e => {
    const tile = e.target.closest('.tile');
    if (tile && e.detail === 0) tap(+tile.dataset.i);
  });

  function tap(i) {
    if (lost) return;
    if (selected !== null && selected !== i && play(selected, i)) return;
    selected = selected === i ? null : i;
    lastMove = null;
    render();
  }
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
    if (e.key === 'Escape' && selected !== null) { selected = null; render(); }
  });

  // ---- Embedding: tell the page around us how tall we are, so the frame can fit.
  // The content's own height, not the page's: the page is never shorter than the frame, so it could only grow.
  const mainEl = document.querySelector('main');
  function reportHeight() {
    if (parent !== window) parent.postMessage({type: 'hiku:height', height: mainEl.offsetTop + mainEl.offsetHeight}, '*');
  }
  new ResizeObserver(() => { reportHeight(); }).observe(mainEl);
  let lastWidth = 0;
  new ResizeObserver(() => { if (boardEl.clientWidth !== lastWidth) { lastWidth = boardEl.clientWidth; if (cells) render(); } }).observe(boardEl);

  fetch(`https://hikupuzzle.com/api/daily?day=${dayKey}`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => { todays = data.boards; todaysHints = data.hints || {}; if (lesson === null) start(tier); })
    .catch(() => { if (lesson === null) statusEl.textContent = T.offline; });
  if (!store.get('learned') && !params.get('level')) startLesson(0);
})();
</script>
<script>
// ?debug=1 shows every touch, pointer and click event at the top of the page, for finding lost taps on phones.
if (new URLSearchParams(location.search).get('debug') === '1') (function () {
  var box = document.createElement('div'), lines = [], t0 = performance.now();
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;font:11px/1.3 monospace;background:rgba(255,255,200,.95);color:#000;max-height:40vh;overflow:hidden;pointer-events:none;white-space:pre;padding:4px';
  document.body.appendChild(box);
  function log(text) { lines.unshift(Math.round(performance.now() - t0) + ' ' + text); lines = lines.slice(0, 18); box.textContent = lines.join('\n'); }
  ['touchstart', 'touchend', 'touchcancel', 'pointerdown', 'pointerup', 'pointercancel', 'click'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      var el = e.target, p = e.changedTouches ? e.changedTouches[0] : e;
      log(type + ' ' + ((el.className && el.className.baseVal === undefined ? el.className : el.tagName) || el.tagName) + ' "' + (el.textContent || '').trim().slice(0, 8) + '" y=' + Math.round(p.clientY) + (el.isConnected ? '' : ' (removed)'));
    }, true);
  });
  window.addEventListener('scroll', function () { log('scroll ' + Math.round(scrollY)); });
})();
</script>
</body>
</html>
