<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Safari on iPhone shows a card to play in the App Clip (or open the app, once installed). Only on the page itself: Safari
     ignores it inside a frame, so embeds on other sites and the game in ChatGPT are not affected. -->
<meta name="apple-itunes-app" content="app-id=6816387508, app-clip-bundle-id=no.rubberduck.cleanjump.Clip, app-clip-display=card">
<title>Dagens Hiku</title>
<meta name="description" content="Dagens Hiku: fire nye tallbrett hver dag, fra lett til ekspert. Tallet sier hvor langt det hopper.">
<link rel="icon" href="../icon.png">
<meta property="og:title" content="Hiku">
<meta property="og:description" content="Four new boards every day. The number says how far it jumps.">
<meta property="og:image" content="https://hikupuzzle.com/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f3eee6;--ink:#2b2f45;--muted:#5a5d6f;--well:#e7e1d6;--cell:#ddd6ca;--tile:#fffaf2;--edge:#cbc2b3;--accent:#3b4a7a;--on-accent:#f3eee6;--soft:#dfe4f4;--guide:#6874a3;--gold:#a86e0e;--gold-bright:#e0a43a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d27;--ink:#ecebf2;--muted:#bdbfcc;--well:#252836;--cell:#2d3040;--tile:#454b64;--edge:#161822;--accent:#9fb0ea;--on-accent:#1b1d27;--soft:#505d93;--guide:#c0ccf7;--gold:#f2c66d;--gold-bright:#f2c66d}}
:root[data-theme="dark"]{--bg:#1b1d27;--ink:#ecebf2;--muted:#bdbfcc;--well:#252836;--cell:#2d3040;--tile:#454b64;--edge:#161822;--accent:#9fb0ea;--on-accent:#1b1d27;--soft:#505d93;--guide:#c0ccf7;--gold:#f2c66d;--gold-bright:#f2c66d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:400 30px/1.1 Georgia,serif;margin:0;letter-spacing:-.5px}
h1 .arc{display:inline-block;width:1.1em;height:.62em;margin-left:.02em;vertical-align:baseline;overflow:visible}
.day{color:var(--muted);font-size:14px}
.rule{color:var(--muted);font-size:14px;margin:6px 0 14px}
.compact header,.compact .rule{display:none}
.compact main{padding-top:16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--cell);border:0;border-radius:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs .mark{font-size:12px;line-height:1;opacity:.8;min-height:12px}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--well);border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:absolute;border-radius:16%;background:var(--cell)}
/* Inside ChatGPT or Claude the squares are named as the assistant names them: A, B, C … above, 1, 2, 3 … beside. */
.in-ai .board{width:calc(100% - 18px);margin:18px 0 0 18px}
.coord{position:absolute;font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:14px;pointer-events:none}
.tile{position:absolute;z-index:1;border-radius:16%;background:var(--tile);box-shadow:0 3px 0 var(--edge);display:flex;align-items:center;justify-content:center;font-weight:500;font-variant-numeric:tabular-nums;cursor:grab;transition:transform .2s,opacity .4s,background .2s;border:0;color:var(--ink);padding:0;font-family:inherit}
.tile .dots{position:absolute;bottom:10%;left:0;right:0;display:flex;justify-content:center;gap:2px;opacity:.35}
.tile .dots i{border-radius:50%;background:currentColor;display:block}
.tile.sel{background:var(--accent);color:var(--on-accent)}
/* A good place to start: a gold ring that breathes, still for anyone who asked for less motion. */
.tile.hint::after{content:'';position:absolute;inset:-6px;border:3px solid var(--gold-bright);border-radius:20%;pointer-events:none;animation:breathe 1.4s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.55;box-shadow:0 0 3px var(--gold-bright)}to{opacity:1;box-shadow:0 0 12px var(--gold-bright)}}
@media (prefers-reduced-motion:reduce){.tile.hint::after{animation:none;opacity:1}}
.tile.target{background:var(--soft);outline:3px solid var(--guide);outline-offset:3px}
.tile.lifted{z-index:5;box-shadow:0 10px 20px rgba(0,0,0,.2);transition:none;cursor:grabbing}
.tile:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px}
.lost .tile{opacity:.45}
svg.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.eq{position:absolute;z-index:6;background:var(--accent);color:var(--on-accent);font-weight:600;padding:6px 12px;border-radius:10px;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;transition:opacity .3s}
.status{min-height:48px;margin:12px 0 8px;font-size:15px;display:flex;align-items:center;gap:10px}
.status.warn{background:var(--soft);border-radius:12px;padding:10px 14px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer}
.pill.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill:disabled{opacity:.35;cursor:default}
.lesson{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.lesson .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.lesson .tip{margin-top:4px}
.linky{background:none;border:0;padding:0;font:inherit;color:var(--link,var(--accent));text-decoration:underline;cursor:pointer}
.info{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 2px 8px}
.done{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:18px;
  background:color-mix(in srgb,var(--well) 86%,transparent);animation:settle .45s ease .25s both}
.done .stars,.done .streak{justify-content:center}
.done .more{max-width:24em}
@keyframes settle{from{opacity:0}to{opacity:1}}
.stars{display:flex;gap:8px;font-size:32px;line-height:1;color:var(--gold-bright)}
.stars span{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.stars span.off{color:var(--muted);opacity:.6}
.stars.glow span{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both,glow 2.2s ease-in-out .9s infinite alternate}
.rtitle{font:400 28px/1.2 Georgia,serif;margin:10px 0 2px;color:var(--ink)}
.rdetail{color:var(--muted);font-size:14px}
.streak{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-top:6px;color:var(--ink)}
.streak svg{color:var(--gold-bright)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{from{text-shadow:0 0 4px rgba(224,164,58,.4)}to{text-shadow:0 0 16px rgba(224,164,58,.95)}}
.tile.land{animation:land .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{from{transform:scale(.72)}to{transform:scale(1)}}
.ghost{position:absolute;border-radius:16%;background:var(--tile);box-shadow:0 3px 0 var(--edge);pointer-events:none;animation:vanish .3s ease-in forwards;z-index:2}
@keyframes vanish{to{transform:scale(.3);opacity:0}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold-bright);pointer-events:none;z-index:7;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
footer{margin-top:18px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--link,var(--accent))}
.app{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;border:1px solid var(--edge);border-radius:999px;padding:6px 12px}
.more{margin-top:8px;font-size:14px;color:var(--muted)}
.more a{color:var(--link,var(--accent));font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Why the board can no longer be cleared, laid over the board as the result is: the short reason, more on asking, and
   the board it is about, with the number it is about filled in and the ones it depends on ringed, as in the apps. */
.whycard{position:absolute;inset:0;z-index:8;background:var(--bg);border-radius:18px;box-shadow:0 0 0 1px var(--edge);padding:12px 16px 16px;
  overflow:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;font-size:15px}
/* Only when it opens: it is put back after every redraw of the board, and must not fade in again each time. */
.whycard.opening{animation:settle .25s ease both}
.whycard .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.whycard .bar span{font-weight:600}
.whycard .bar button{width:32px;height:32px;flex:none;border-radius:50%;border:0;background:var(--cell);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.whycard .bar button:hover{background:var(--edge)}
.whycard p{margin:0}
.whycard .head{font-weight:600}
.whycard .reason{color:var(--muted)}
.whycard .linky{align-self:flex-start}
/* What has to happen first, numbered; each one shows on the board, and again goes back to the board before the move. */
.whycard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.whycard ol button{font:inherit;color:var(--ink);background:none;border:0;padding:2px 0;display:flex;gap:10px;align-items:baseline;text-align:left;cursor:pointer;width:100%;min-height:44px}
.whycard .tip{font-weight:600;color:var(--accent);font-size:14px}
.whycard ol b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transform:translateY(2px)}
.whycard ol button[aria-pressed="true"] b{background:var(--accent);color:var(--on-accent)}
.whycard .when{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
/* The board takes the height that is left under the words, and is as wide as it is high. */
.whyboard{display:grid;gap:4px;scroll-margin-bottom:16px;flex:1 1 0;min-height:180px;aspect-ratio:1;max-width:100%;align-self:center;margin-top:4px}
.whyboard .name{font-size:11px;line-height:1;font-weight:600;color:var(--muted);text-align:center;align-self:center}
.whyboard .sq{position:static;min-height:0;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:clamp(12px,3.6vw,18px);font-variant-numeric:tabular-nums}
.whyboard .num{background:var(--tile);box-shadow:0 2px 0 var(--edge);opacity:.35}
.whyboard .num.main{background:var(--accent);color:var(--on-accent);opacity:1}
.whyboard .num.dep{background:var(--soft);outline:3px solid var(--guide);outline-offset:2px;opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header><h1>Hiku<svg class="arc" viewBox="0 0 110 62" aria-hidden="true"><path d="M7.2 41.8 Q55 -34 102.8 41.8" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6.5 8"/><circle cx="7.2" cy="54.8" r="7.2" fill="var(--ink)"/><circle cx="102.8" cy="54.8" r="7.2" fill="var(--ink)"/></svg></h1><span class="day" id="day"></span></header>
  <p class="rule" id="rule"></p>
  <div class="lesson" id="lesson" hidden></div>
  <div class="tabs" id="tabs" role="group" aria-label=""></div>
  <div class="info"><span id="left"></span><span id="movesInfo"></span></div>
  <div class="board" id="board" role="group"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <p class="sr" id="said" aria-live="assertive"></p>
  <div class="controls" id="controls"></div>
  <p class="replay"><button class="linky" id="replay" type="button"></button></p>
  <footer><span id="made"></span><a id="app" class="app" target="_blank" rel="noopener"></a></footer>
</main>
<script>
(() => {
  // ---- Settings from the address: ?lang=nb|en|sv|da|fi|de, ?theme=dark|light, ?level=easy|medium|hard|expert
  // A host that frames the game without a URL of its own (an app inside ChatGPT or Claude) passes the same settings
  // as window.HIKU_PARAMS, and its own link and campaign as HIKU_HOME and HIKU_SITE.
  const params = new URLSearchParams(window.HIKU_PARAMS || location.search);
  if (params.get('theme') === 'dark' || params.get('theme') === 'light') document.documentElement.dataset.theme = params.get('theme');
  // ?color=c8102e: the site's own colour for the buttons, the tabs and the picked number. The rest is worked out from
  // it: a soft shade, the ring round a target, white or dark text on the buttons, whichever reads, and a lighter
  // version in dark mode. The board keeps its own look, so the game stays readable whatever colour a site picks.
  const brand = /^[0-9a-f]{6}$/i.test(params.get('color') || '') ? '#' + params.get('color') : null;
  if (brand) {
    const lin = c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4;
    const [r, g, b] = [1, 3, 5].map(k => lin(parseInt(brand.slice(k, k + 2), 16) / 255));
    const lum = .2126 * r + .7152 * g + .0722 * b, on = lum > .179 ? '#16171d' : '#ffffff';
    // As text on the light page it needs 4.5:1; a light colour such as yellow is darkened for links.
    const link = lum > .15 ? `color-mix(in srgb,${brand} 45%,#16171d)` : brand;
    // A site with its own colour gets the neutral look news sites give their own content: a white card, grey squares,
    // near-black text. The game's warm paper colour would stand out as a foreign box on a white or grey page.
    // The page's own background, when the embed found one and it is light; the squares are a shade darker than it.
    const ground = /^[0-9a-f]{6}$/i.test(params.get('bg') || '') ? '#' + params.get('bg') : '#ffffff';
    const groundLum = [1, 3, 5].map(k => lin(parseInt(ground.slice(k, k + 2), 16) / 255)).reduce((s, c, k) => s + c * [.2126, .7152, .0722][k], 0);
    const bg = groundLum > .6 ? ground : '#ffffff';
    const paper = `--bg:${bg};--ink:#16171d;--muted:#5b5d68;--well:color-mix(in srgb,${bg} 94%,#16171d);--cell:color-mix(in srgb,${bg} 87%,#16171d);--tile:#ffffff;--edge:color-mix(in srgb,${bg} 78%,#16171d)`;
    const night = '--bg:#16171d;--ink:#ececef;--muted:#b5b6bf;--well:#202128;--cell:#2b2c34;--tile:#3c3d46;--edge:#0c0c10';
    const dark = `${night};--accent:color-mix(in srgb,${brand} 55%,#fff);--link:color-mix(in srgb,${brand} 55%,#fff);--on-accent:#16171d;--soft:color-mix(in srgb,${brand} 40%,#16171d);--guide:color-mix(in srgb,${brand} 40%,#fff)`;
    const style = document.createElement('style');
    style.textContent = `:root{${paper};--accent:${brand};--link:${link};--on-accent:${on};--soft:color-mix(in srgb,${brand} 12%,${bg});--guide:color-mix(in srgb,${brand} 75%,${bg})}` +
      `@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
    document.head.appendChild(style);
  }
  // ?compact=1: no title or rule, for a page that already shows them.
  if (params.get('compact') === '1') document.documentElement.classList.add('compact');
  // In a frame the page around sets the height, so a scrollbar here would only flicker in and out as the content
  // grows, changing the board's width and redrawing it under the reader's finger.
  if (parent !== window) document.documentElement.style.overflow = 'hidden';

  // The languages of the app, with its own words where it has them. Norwegian unless another is asked for;
  // "no" and "nn" count as Norwegian, and a region such as sv-SE is ignored.
  const LANGS = {
    nb: {learn: 'Lær å spille', lessonOf: k => '{k} av 3'.replace('{k}', k), skip: 'Hopp over', next: 'Neste →', toDaily: 'Til dagens brett →', replay: 'Lær å spille på nytt', lessons: [{"name": "Første hopp", "tip": "Dra et tall dit det skal hoppe, eller trykk på tallet og så på målet."}, {"name": "Én vei ut", "tip": "Et tall som bare når ett annet tall, må ta det. Ikke la noen andre ta det først."}, {"name": "Partall", "tip": "Tall som bare når hverandre, forsvinner bare hvis summen er et partall. Er den et oddetall, blir ett tall igjen."}],
         left: k => (k === 1 ? '%d tall igjen' : '%d tall igjen').replace('%d', k), movesText: (n, s) => `${n} trekk · ${s}`, movesA11y: (n, s) => `${n} trekk, ${s} av 3 stjerner mulig`, cleared: 'Brettet er ryddet', flawless: 'Feilfritt!', noUndo: 'Løst uten å angre.', undoText: k => (k === 1 ? 'Med %d angring.' : 'Med %d angringer.').replace('%d', k), streak: k => (k === 1 ? '%d dag på rad' : '%d dager på rad').replace('%d', k), retry: 'Prøv igjen', moveSaid: (a, b, sq, left) => `${a} på ${b} i ${sq}, blir ${left}.`, goneSaid: (a, b, sq) => `${a} på ${b} i ${sq}, begge forsvant.`, resultSaid: (s, title, detail) => `${s} av 3 stjerner. ${sentence(title)} ${detail}`,
         offline: 'Fikk ikke hentet dagens brett. Sjekk nettet og prøv igjen.',
         moved: (a, b, from, to, eq) => `${a} fra ${from} til ${b} på ${to}: ${eq}.`, undone: 'Angret.',
         locale: 'nb-NO', title: 'Dagens Hiku', rule: 'Tallet sier hvor langt det hopper. Lander det på et annet, trekkes de fra hverandre. Få alle tallene til å forsvinne.',
         tiers: {easy: 'Lett', medium: 'Middels', hard: 'Vanskelig', expert: 'Ekspert'}, tabs: 'Vanskelighetsgrad',
         start: 'Dra et tall dit det skal hoppe, eller trykk på tallet og så på målet.',
         pick: 'Trykk på et av de markerte tallene.', noMove: v => `${v} når ikke noe tall herfra. Velg et annet.`,
         lost: 'Brettet kan ikke lenger løses. Angre for å gå tilbake.', stuck: 'Ingen tall når hverandre lenger. Angre for å gå tilbake.',
         undo: 'Angre', restart: 'Start på nytt', share: 'Del resultat', copied: 'Kopiert!',
         solved: {3: 'Feilfritt!', 2: 'Godt løst!', 1: 'Løst!'}, undos: n => n === 0 ? 'Uten å angre.' : n === 1 ? 'Med én angring.' : `Med ${n} angringer.`,
         made: 'Nye brett hver dag, kom tilbake i morgen!', app: 'Last ned Hiku for iPhone', appAndroid: 'Last ned Hiku for Android', moreLinkAndroid: 'Hiku på Google Play',
         more: 'Vil du ha mer? Appen har 50 brett til, og de første lærer deg knepene:', moreLink: 'Hiku i App Store',
         gone: (a, b) => `${a} − ${b} = borte`, tile: (v, sq) => `${v} på ${sq}`, empty: sq => `${sq}, tom`, startHere: 'et godt sted å starte'},
    en: {learn: 'Learn to play', lessonOf: k => '{k} of 3'.replace('{k}', k), skip: 'Skip', next: 'Next →', toDaily: "To today's boards →", replay: 'Learn to play again', lessons: [{"name": "First jump", "tip": "Drag a number to where it jumps, or tap the number and then its target."}, {"name": "One way out", "tip": "A number that can reach only one other must take it. Don't let anything else take it first."}, {"name": "Even numbers", "tip": "Numbers that can only reach each other vanish only if they add up to an even number. If the sum is odd, one is left over."}],
         left: k => (k === 1 ? '%d number left' : '%d numbers left').replace('%d', k), movesText: (n, s) => `Moves: ${n} · ${s}`, movesA11y: (n, s) => `Moves: ${n}, ${s} of 3 stars possible`, cleared: 'Board cleared', flawless: 'Flawless!', noUndo: 'Solved without undoing.', undoText: k => (k === 1 ? 'With %d undo.' : 'With %d undos.').replace('%d', k), streak: k => (k === 1 ? '%d day in a row' : '%d days in a row').replace('%d', k), retry: 'Try again', moveSaid: (a, b, sq, left) => `${a} onto ${b} at ${sq}, leaves ${left}.`, goneSaid: (a, b, sq) => `${a} onto ${b} at ${sq}, both gone.`, resultSaid: (s, title, detail) => `${s} of 3 stars. ${sentence(title)} ${detail}`,
         offline: "Couldn't fetch today's boards. Check your connection and try again.",
         moved: (a, b, from, to, eq) => `${a} from ${from} onto ${b} on ${to}: ${eq}.`, undone: 'Undone.',
         locale: 'en-GB', title: 'Daily Hiku', rule: 'The number says how far it jumps. Land on another and they subtract. Make all the numbers disappear.',
         tiers: {easy: 'Easy', medium: 'Medium', hard: 'Hard', expert: 'Expert'}, tabs: 'Difficulty',
         start: 'Drag a number to where it jumps, or tap the number and then its target.',
         pick: 'Tap one of the marked numbers.', noMove: v => `${v} can’t reach any number from here. Pick another.`,
         lost: 'This board can no longer be cleared. Undo to go back.', stuck: 'No numbers can reach each other any more. Undo to go back.',
         undo: 'Undo', restart: 'Start over', share: 'Share result', copied: 'Copied!',
         solved: {3: 'Flawless!', 2: 'Well solved!', 1: 'Solved!'}, undos: n => n === 0 ? 'Without undoing.' : n === 1 ? 'With one undo.' : `With ${n} undos.`,
         made: 'New boards every day, come back tomorrow!', app: 'Get Hiku for iPhone', appAndroid: 'Get Hiku for Android', moreLinkAndroid: 'Hiku on Google Play',

      body.className = 'head';
      body.textContent = Explain.say(found.headline, lang);
      const reason = document.createElement('p');
      reason.className = 'reason';
      reason.textContent = Explain.say(found.reason, lang);
      // A move that came too early, or emptied a square, is told on the board before it, with what to do instead: all at once.
      const aboutMove = found.kind === 'wrongMoment' || found.kind === 'needsSquare';
      const when = document.createElement('p');
      when.className = 'when';
      let board = whyBoard(found, size), shown = -1;
      const show = k => {
        shown = shown === k ? -1 : k;
        const step = found.steps[shown];
        when.textContent = step ? Explain.say({key: 'explain.beforeStep', args: [{count: shown + 1}]}, lang) : words('explain.beforeMove');
        const next = whyBoard(step ? {cells: step.cells, focus: [step.from, step.to]} : found, size);
        board.replaceWith(next);
        board = next;
        list.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === shown)));
        // A step chosen far above the board brings the board into view, so its change is seen.
        board.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      };
      const list = document.createElement('ol');
      (found.steps || []).forEach((step, k) => {
        const item = document.createElement('li'), button = document.createElement('button'), number = document.createElement('b');
        button.type = 'button';
        button.setAttribute('aria-pressed', 'false');
        number.textContent = k + 1;
        button.append(number, Explain.say(step.text, lang));
        button.onclick = () => show(k);
        item.appendChild(button);
        list.appendChild(item);
      });
      if (list.children.length) {
        const first = document.createElement('p'), hint = document.createElement('p');
        first.textContent = words('explain.tooEarly.first');
        hint.className = 'when';
        hint.textContent = words('explain.tapStep');
        card.append(first, hint, list);
      }
      // A habit to take to the next board: each kind of mistake has one to look out for before moving.
      const tip = document.createElement('p');
      tip.className = 'tip';
      tip.textContent = words('explain.tip.' + found.kind);
      if (aboutMove) {
        when.textContent = words('explain.beforeMove');
        card.append(reason, tip, when, board);
        return;
      }
      reason.hidden = true;
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'linky';
      more.textContent = words('explain.more');
      more.onclick = () => { reason.hidden = false; more.remove(); };
      card.append(more, reason, tip, board);
    }, 30);
  }

  // The board the reason is told on, or a step of it, with A, B, C … above and 1, 2, 3 … beside it. Screen readers get
  // the words, which name every square that matters.
  function whyBoard(found, size) {
    const grid = document.createElement('div');
    grid.className = 'whyboard';
    grid.setAttribute('aria-hidden', 'true');
    // minmax(0, 1fr): rows share the square evenly, so a short card cannot push the last row out of it.
    grid.style.gridTemplateColumns = grid.style.gridTemplateRows = `14px repeat(${size}, minmax(0, 1fr))`;
    const cell = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; grid.appendChild(d); };
    cell('name', '');
    for (let c = 0; c < size; c++) cell('name', String.fromCharCode(65 + c));
    for (let r = 0; r < size; r++) {
      cell('name', String(r + 1));
      for (let c = 0; c < size; c++) {
        const i = r * size + c, v = found.cells[i];
        cell('sq' + (v ? ' num' : '') + (i === found.focus[0] ? ' main' : found.focus.includes(i) ? ' dep' : ''), v || '');
      }
    }
    return grid;
  }
  el('rule').textContent = T.rule;
  tabsEl.setAttribute('aria-label', T.tabs);
  el('day').textContent = now.toLocaleDateString(T.locale, T.date);
  el('made').textContent = T.made;
  el('app').href = APP_URL;
  el('app').innerHTML = ANDROID
    ? '<svg width="16" height="10.5" viewBox="1 3.8 14 9.2" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M1.5 12.5a6.5 6.5 0 0 1 13 0zM5.3 8.6a.85.85 0 1 0 0 1.7a.85.85 0 1 0 0-1.7zm5.4 0a.85.85 0 1 0 0 1.7a.85.85 0 1 0 0-1.7z"/><path stroke="currentColor" stroke-width="1.1" stroke-linecap="round" d="M4.2 6.6 2.9 4.4m8.9 2.2 1.3-2.2"/></svg>' + T.appAndroid
    : '<svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path fill="currentColor" d="M10.8 8c0-1.9 1.6-2.8 1.6-2.9-.9-1.3-2.2-1.5-2.7-1.5-1.1-.1-2.2.7-2.8.7-.6 0-1.5-.7-2.4-.6C3.3 3.7 2.2 4.4 1.6 5.5.3 7.7 1.3 11 2.5 12.8c.6.9 1.3 1.9 2.3 1.8.9 0 1.3-.6 2.4-.6 1.1 0 1.4.6 2.4.6 1 0 1.6-.9 2.2-1.8.7-1 1-2 1-2-.1 0-2-.8-2-2.8zM9 2.3c.5-.6.9-1.5.8-2.3-.7 0-1.6.5-2.1 1.1-.5.5-.9 1.4-.8 2.2.8.1 1.6-.4 2.1-1z"/></svg>' + T.app;

  const squareName = i => String.fromCharCode(65 + i % n) + (Math.floor(i / n) + 1);
  const resultKey = t => `${dayKey}/${t}`;
  const stars = u => u === 0 ? 3 : u <= 2 ? 2 : 1;
  const starText = k => '★'.repeat(k) + '☆'.repeat(3 - k);
  const remaining = () => cells.filter(v => v > 0).length;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;
  const resultTitle = () => stars(undos) === 3 ? T.flawless : T.cleared;
  // Ends a spoken sentence once: "Feilfritt!" keeps its own mark, "8 tall igjen" gets a full stop.
  const sentence = t => /[.!?]$/.test(t) ? t : t + '.';
  const resultDetail = () => undos === 0 ? T.noUndo : T.undoText(undos);

  // Days in a row with a daily board solved in this browser, counting back from today, or from yesterday while
  // today's are still open.
  function streak() {
    const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const solved = d => TIERS.some(t => store.get(`${key(d)}/${t}`));
    let day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (!solved(day)) day.setDate(day.getDate() - 1);
    let count = 0;
    while (solved(day)) { count++; day.setDate(day.getDate() - 1); }
    return count;
  }

  let lesson = null;
  function startLesson(k) {
    lesson = k;
    n = LESSONS[k].size; cells = LESSONS[k].cells.slice(); history = []; undos = 0; selected = null; lost = false; lastMove = null;
    checkToken++;
    render();
    const L = T.lessons[k];
    say(`${T.learn}, ${T.lessonOf(k + 1)}: ${L.name}. ${L.tip}`);
  }
  function endLessons() {
    store.set('learned', true);
    lesson = null;
    if (todays) { start(tier); say(`${T.title}, ${T.tiers[tier]}. ${sentence(T.left(remaining()))}`); }
    else { render(); statusEl.textContent = T.offline; }
  }

  function start(t) {
    lesson = null;
    tier = t;
    store.set('tier', t);
    const b = boardFor(t);
    n = b.size; cells = b.cells; history = []; undos = 0; selected = null; lost = false; lastMove = null; moveLog = []; played = [];
    checkToken++;
    render();
  }

  function play(from, to, dragged) {
    if (busy || lost || !targets(cells, n, from).includes(to)) return false;
    const finish = () => {
      history.push(cells);
      moveLog.push(squareName(from) + '-' + squareName(to));
      played.push({from, to});
      lastMove = {from, to, a: cells[from], b: cells[to]};
      cells = moved(cells, from, to);
      selected = null;
      const clear = isClear(cells);
      if (clear && lesson === null) {
        const best = store.get(resultKey(tier));
        if (!best || best < stars(undos)) store.set(resultKey(tier), stars(undos));
      }
      const m = lastMove, sq = squareName(to);
      const said = m.a === m.b ? T.goneSaid(m.a, m.b, sq) : T.moveSaid(m.a, m.b, sq, Math.abs(m.a - m.b));
      say(said + ' ' + (clear ? T.resultSaid(stars(undos), resultTitle(), resultDetail()) : sentence(T.left(remaining()))));
      render();
      if (!reduced) landed(m, clear);
      check();
    };
    const el = boardEl.querySelector(`.tile[data-i="${from}"]`);
    if (dragged || reduced || !el) { finish(); return true; }
    // The number slides over to where it lands before the board changes.
    const L = layout(), a = L.at(from), b = L.at(to);
    busy = true;
    el.style.zIndex = 5;
    el.style.transition = 'transform .18s ease-out';
    el.style.transform = `translate(${b.x - a.x}px,${b.y - a.y}px)`;
    setTimeout(() => { busy = false; finish(); }, 180);
    return true;
  }

  // What is left on the landing square settles in; equal numbers shrink away; a cleared board sparkles.
  function landed(m, clear) {
    const L = layout(), p = L.at(m.to);
    if (m.a !== m.b) {
      boardEl.querySelector(`.tile[data-i="${m.to}"]`)?.classList.add('land');
    } else {
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      Object.assign(ghost.style, {left: p.x + 'px', top: p.y + 'px', width: L.side + 'px', height: L.side + 'px'});
      boardEl.appendChild(ghost);
      setTimeout(() => ghost.remove(), 320);
    }
    if (!clear) return;
    for (let k = 0; k < 22; k++) {
      const spark = document.createElement('i');
      spark.className = 'spark';
      const angle = Math.random() * Math.PI * 2, reach = 40 + Math.random() * 90;
      Object.assign(spark.style, {left: p.x + L.side / 2 + 'px', top: p.y + L.side / 2 + 'px', animationDelay: Math.random() * .15 + 's'});
      spark.style.setProperty('--dx', Math.cos(angle) * reach + 'px');
      spark.style.setProperty('--dy', Math.sin(angle) * reach + 'px');
      boardEl.appendChild(spark);
      setTimeout(() => spark.remove(), 1200);
    }
  }

  // The check runs in the worker; an answer for a board the player has already moved on from is dropped.
  worker.onmessage = e => {
    if (e.data.id !== checkToken) return;
    lost = e.data.answer === false;
    if (lost) render();
  };
  function check() {
    if (isClear(cells)) return;
    worker.postMessage({id: ++checkToken, key: lesson === null ? tier + dayKey : 'lesson' + lesson, n, cells});
  }

  function undo() {
    if (!history.length) return;
    cells = history.pop(); moveLog.pop(); played.pop(); undos++; selected = null; lost = false; lastMove = null; checkToken++;
    say(T.undone + ' ' + sentence(T.left(remaining())));
    render();
  }
  function restart() {
    if (!history.length) return;
    const spent = undos + 1;
    if (lesson !== null) startLesson(lesson); else start(tier);
    undos = spent;
    render();
  }

  // ---- Drawing
  function layout() {
    const w = boardEl.clientWidth, pad = w * 0.03, gap = w * 0.02;
    const side = (w - pad * 2 - gap * (n - 1)) / n;
    return {side, at: i => ({x: pad + (i % n) * (side + gap), y: pad + Math.floor(i / n) * (side + gap)})};
  }

  function render() {
    renderTabs();
    if (lesson === null && cells) dispatchEvent(new CustomEvent('hiku:state', {detail: gameState()}));
    const head = el('lesson');
    tabsEl.hidden = lesson !== null;
    head.hidden = lesson === null;
    if (lesson !== null) {
      const L = T.lessons[lesson];
      head.innerHTML = `<div class="head"><span>${T.learn} · ${T.lessonOf(lesson + 1)} · ${L.name}</span><button class="linky" type="button" id="skip">${T.skip}</button></div><div class="tip">${L.tip}</div>`;
      el('skip').onclick = endLessons;
    }
    const replay = el('replay');
    replay.hidden = lesson !== null;
    // Inside ChatGPT or Claude the lessons were never shown, so it is "learn to play", not "again".
    replay.textContent = document.documentElement.classList.contains('in-ai') ? T.learn : T.replay;
    replay.onclick = () => startLesson(0);
    el('left').textContent = T.left(remaining());
    const info = el('movesInfo');
    info.textContent = T.movesText(history.length, starText(stars(undos)));
    info.setAttribute('aria-label', T.movesA11y(history.length, stars(undos)));
    const L = layout();
    boardEl.innerHTML = '';
    boardEl.classList.toggle('lost', lost);
    boardEl.setAttribute('aria-label', T.tiers[tier]);
    // One element per square in reading order, A1, B1, C1 … row by row, so a screen reader follows the board:
    // an empty square is a labelled cell, a number is a button above it.
    const tgts = selected !== null ? targets(cells, n, selected) : [];
    // A daily board shows its good place to start until the first move, as the app does with the setting on.
    const hint = lesson === null && !history.length && !lost ? todaysHints[tier] : undefined;
    cells.forEach((v, i) => {
      const p = L.at(i);
      const sq = document.createElement('div');
      sq.className = 'sq';
      Object.assign(sq.style, {left: p.x + 'px', top: p.y + 'px', width: L.side + 'px', height: L.side + 'px'});
      if (v) sq.setAttribute('aria-hidden', 'true');
      else { sq.setAttribute('role', 'img'); sq.setAttribute('aria-label', T.empty(squareName(i))); }
      boardEl.appendChild(sq);
      if (!v) return;
      const b = document.createElement('button');
      const hinted = i === hint && i !== selected && !tgts.includes(i);
      b.className = 'tile' + (i === selected ? ' sel' : '') + (tgts.includes(i) ? ' target' : '') + (hinted ? ' hint' : '');
      b.dataset.i = i;
      b.setAttribute('aria-label', T.tile(v, squareName(i)) + (i === hint ? ', ' + T.startHere : ''));
      Object.assign(b.style, {left: p.x + 'px', top: p.y + 'px', width: L.side + 'px', height: L.side + 'px', fontSize: L.side * 0.4 + 'px'});
      b.textContent = v;
      const dots = document.createElement('span');
      dots.className = 'dots';
      const d = Math.min(4, L.side * 0.07);
      for (let k = 0; k < v; k++) { const dot = document.createElement('i'); dot.style.width = dot.style.height = d + 'px'; dots.appendChild(dot); }
      b.appendChild(dots);
      if (lost) b.disabled = true;
      boardEl.appendChild(b);
    });
    if (document.documentElement.classList.contains('in-ai')) {
      for (let k = 0; k < n; k++) {
        const p = L.at(k), q = L.at(k * n);
        const col = document.createElement('span'), row = document.createElement('span');
        col.className = row.className = 'coord';
        col.setAttribute('aria-hidden', 'true'); row.setAttribute('aria-hidden', 'true');
        col.textContent = String.fromCharCode(65 + k);
        row.textContent = k + 1;
        Object.assign(col.style, {left: p.x + 'px', width: L.side + 'px', top: '-16px'});
        Object.assign(row.style, {top: q.y + L.side / 2 - 7 + 'px', left: '-16px', width: '12px'});
        boardEl.append(col, row);
      }
    }
    if (selected !== null) drawGuides(selected, L);
    if (lastMove) showSum(lastMove, L);
    renderStatus();
    renderControls();
  }

  // Dashed arcs from the picked number to where it can land, stopping at the tile edges.
  function drawGuides(from, L) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'guides');
    boardEl.appendChild(svg);
    const c = i => { const p = L.at(i); return {x: p.x + L.side / 2, y: p.y + L.side / 2}; };
    for (const to of targets(cells, n, from)) {
      const s = c(from), e = c(to), dist = Math.hypot(e.x - s.x, e.y - s.y), lift = dist * 0.28;
      const m = {x: (s.x + e.x) / 2, y: (s.y + e.y) / 2};
      const ctrl = s.x === e.x ? {x: m.x - lift, y: m.y} : {x: m.x, y: m.y - lift};
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', `M${s.x},${s.y} Q${ctrl.x},${ctrl.y} ${e.x},${e.y}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--guide)');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-dasharray', '5 6');
      svg.appendChild(path);
      // Only the part between the two tiles is drawn: the curve is traced from half a tile past the start to half a
      // tile before the end, so the dashes run evenly and never cover a number.
      const len = path.getTotalLength(), cut = Math.min(len * 0.45, L.side * 0.62), points = [];
      for (let k = 0; k <= 24; k++) { const pt = path.getPointAtLength(cut + (len - 2 * cut) * k / 24); points.push(`${pt.x.toFixed(1)},${pt.y.toFixed(1)}`); }
      path.setAttribute('d', 'M' + points.join(' L'));
    }
    boardEl.appendChild(svg);
  }

  const equation = m => m.a === m.b ? T.gone(m.a, m.b) : `${Math.max(m.a, m.b)} − ${Math.min(m.a, m.b)} = ${Math.abs(m.a - m.b)}`;
  // Spoken right away, ahead of the status line, so a move is heard as it is made.
  function say(text) { const el = document.getElementById('said'); el.textContent = ''; setTimeout(() => { el.textContent = text; }, 30); }

  function showSum(m, L) {
    const p = L.at(m.to), eq = document.createElement('div');
    eq.className = 'eq';
    eq.textContent = equation(m);
    eq.setAttribute('aria-hidden', 'true');
    Object.assign(eq.style, {left: p.x + L.side / 2 + 'px', top: Math.max(34, p.y - 6) + 'px'});
    boardEl.appendChild(eq);
    const shown = m;
    setTimeout(() => { if (lastMove === shown) { eq.style.opacity = 0; setTimeout(() => eq.remove(), 350); } }, 1100);
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    for (const t of TIERS) {
      const b = document.createElement('button');
      const done = store.get(resultKey(t));
      b.setAttribute('aria-pressed', t === tier);
      b.setAttribute('aria-label', T.tiers[t] + (done ? `, ${done}/3 ★` : ''));
      b.innerHTML = `<span aria-hidden="true">${T.tiers[t]}</span><span class="mark" aria-hidden="true">${done ? '★'.repeat(done) : ''}</span>`;
      b.onclick = () => { if (t !== tier) { start(t); say(`${T.title}, ${T.tiers[t]}. ${sentence(T.left(remaining()))}`); } };
      tabsEl.appendChild(b);
    }
  }

  function renderStatus() {
    statusEl.className = 'status';
    if (!lost) { whyCard = null; whyLink.setAttribute('aria-expanded', 'false'); }
    if (isClear(cells)) {
      const k = stars(undos), days = lesson === null ? streak() : 0;
      // The result lies on the cleared board, so the box keeps its height from the first move to the last.
      statusEl.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'done';
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label', T.resultSaid(k, resultTitle(), resultDetail()));
      const flame = '<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path fill="currentColor" d="M7 0c.6 2.6 3.9 4.2 3.9 8.3A3.9 3.9 0 0 1 7 12.2c-1.2 0-2.3-.6-2.9-1.5-.5 1.2-.3 2.5.4 3.5C2.3 13.6 1 11.6 1 9.4 1 5.5 5.6 4.3 7 0z"/></svg>';
      box.innerHTML = `<div class="stars${k === 3 && !reduced ? ' glow' : ''}" aria-hidden="true">` +
        [0, 1, 2].map(j => `<span class="${j < k ? '' : 'off'}" style="animation-delay:${reduced ? 0 : .15 + j * .18}s">${j < k ? '★' : '☆'}</span>`).join('') + '</div>' +
        `<div class="rtitle" aria-hidden="true">${resultTitle()}</div><div class="rdetail" aria-hidden="true">${resultDetail()}</div>` +
        (days > 0 ? `<div class="streak">${flame}${T.streak(days)}</div>` : '') +
        (lesson === null ? `<div class="more">${T.more} <a href="${APP_URL}" target="_blank" rel="noopener">${ANDROID ? T.moreLinkAndroid : T.moreLink}</a></div>` : '');
      boardEl.appendChild(box);
    } else if (lost) {
      statusEl.className = 'status warn';
      // The line and its link are kept between redraws, so a redraw while the link is pressed does not swallow it.
      lostText.data = (hasMove(cells, n) ? T.lost : T.stuck) + ' ';
      whyLink.hidden = !(Explain && history.length && lesson === null);
      if (Explain && whyLink.textContent !== words('explain.why')) whyLink.textContent = words('explain.why');
      if (statusEl.firstChild !== lostLine || statusEl.childNodes.length !== 1) statusEl.replaceChildren(lostLine);
      if (whyCard && !boardEl.contains(whyCard)) boardEl.appendChild(whyCard);
    } else if (!history.length && selected === null && lesson === null) {
      statusEl.textContent = T.start;
    } else if (selected !== null && !targets(cells, n, selected).length) {
      statusEl.textContent = T.noMove(cells[selected]);
    } else if (selected !== null) {
      statusEl.textContent = T.pick;
    } else {
      statusEl.textContent = '';
    }
  }

  // The buttons are kept between redraws and only updated. A redraw can land while a button is being pressed (the
  // lost-board check answering, or the frame resizing); a new button there would swallow the click.
  function renderControls() {
    let used = 0;
    const add = (label, fn, primary, disabled) => {
      let b = controlsEl.children[used];
      if (!b) { b = document.createElement('button'); controlsEl.appendChild(b); }
      used++;
      b.className = 'pill' + (primary ? ' primary' : '');
      if (b.textContent !== label) b.textContent = label;
      b.onclick = fn; b.disabled = !!disabled;
      return b;
    };
    fillControls(add);
    while (controlsEl.children.length > used) controlsEl.lastChild.remove();
  }

  function fillControls(add) {
    if (isClear(cells) && lesson !== null) {
      const last = lesson === LESSONS.length - 1;
      add(last ? T.toDaily : T.next, () => last ? endLessons() : startLesson(lesson + 1), true);
      if (stars(undos) < 3) add(T.retry, () => startLesson(lesson));
    } else if (isClear(cells)) {
      const share = add(T.share, async () => {
        const text = `Hiku · ${T.tiers[tier]} · ${now.toLocaleDateString(T.locale, {day: 'numeric', month: 'short'})}\n${'★'.repeat(stars(undos))}${'☆'.repeat(3 - stars(undos))}\n${window.HIKU_HOME || location.origin + location.pathname}`;
        try {
          if (navigator.share) await navigator.share({text});
          else { await navigator.clipboard.writeText(text); share.textContent = T.copied; }
        } catch {}
      }, true);
      if (stars(undos) < 3) add(T.retry, () => { start(tier); say(`${T.title}, ${T.tiers[tier]}. ${sentence(T.left(remaining()))}`); });
    } else {
      add(T.undo, undo, lost, !history.length);
      add(T.restart, restart, false, !history.length);
    }
  }

  // ---- Input: tap a number then its target, or drag it there.
  let drag = null;
  boardEl.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if (!tile || lost) return;
    drag = {i: +tile.dataset.i, el: tile, x: e.clientX, y: e.clientY, moved: false};
    tile.setPointerCapture(e.pointerId);
  });
  boardEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 6) return;
    if (!drag.moved) {
      drag.moved = true;
      selected = drag.i; lastMove = null;
      render();
      drag.el = boardEl.querySelector(`.tile[data-i="${drag.i}"]`);
      drag.el.classList.add('lifted');
    }
    drag.el.style.transform = `translate(${dx}px,${dy}px) scale(1.06)`;
    // Over a number it can land on, the sum shows above the lifted number, as in the app.
    const r = boardEl.getBoundingClientRect(), L = layout(), x = e.clientX - r.left, y = e.clientY - r.top;
    const over = cells.findIndex((_, i) => { const p = L.at(i); return x >= p.x && x <= p.x + L.side && y >= p.y && y <= p.y + L.side; });
    let eq = boardEl.querySelector('.eq.dragging');
    if (over >= 0 && targets(cells, n, drag.i).includes(over)) {
      if (!eq) { eq = document.createElement('div'); eq.className = 'eq dragging'; eq.setAttribute('aria-hidden', 'true'); boardEl.appendChild(eq); }
      eq.textContent = equation({a: cells[drag.i], b: cells[over]});
      const p = L.at(drag.i);
      Object.assign(eq.style, {left: p.x + L.side / 2 + dx + 'px', top: Math.max(34, p.y + dy - 6) + 'px'});
    } else if (eq) {
      eq.remove();
    }
  });
  // The board is redrawn only once the touch has ended. Redrawn while the finger is still lifting, the number under
  // it is gone before iOS delivers the end of the touch, and iOS then swallows the next tap whole: a button or a
  // number needed two. A touch waits for its touchend, which some browsers send well after pointerup; a mouse or pen
  // goes on at once.
  let afterTouch = null;
  document.addEventListener('touchend', () => { const run = afterTouch; afterTouch = null; if (run) setTimeout(run); }, true);
  function whenLifted(e, run) {
    if (e.pointerType !== 'touch') { run(); return; }
    afterTouch = run;
    setTimeout(() => { if (afterTouch === run) { afterTouch = null; run(); } }, 250);
  }
  boardEl.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved) { whenLifted(e, () => tap(d.i)); return; }
    const r = boardEl.getBoundingClientRect(), L = layout();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const over = cells.findIndex((_, i) => { const p = L.at(i); return x >= p.x && x <= p.x + L.side && y >= p.y && y <= p.y + L.side; });
    whenLifted(e, () => { if (over < 0 || !play(d.i, over, true)) { selected = null; render(); } });
  });
  boardEl.addEventListener('pointercancel', () => { drag = null; selected = null; render(); });

  // Enter or space on a focused number, for keyboards and screen readers.
  boardEl.addEventListener('click', e => {
    const tile = e.target.closest('.tile');
    if (tile && e.detail === 0) tap(+tile.dataset.i);
  });

  function tap(i) {
    if (lost) return;
    if (selected !== null && selected !== i && play(selected, i)) return;
    selected = selected === i ? null : i;
    lastMove = null;
    render();
  }
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
    if (e.key === 'Escape' && selected !== null) { selected = null; render(); }
  });

  // ---- Embedding: tell the page around us how tall we are, so the frame can fit.
  // The content's own height, not the page's: the page is never shorter than the frame, so it could only grow.
  // ---- For an assistant the game runs inside (ChatGPT, Claude): the state of today's board, and a way to open a board
  // and make moves on it, so the assistant can see what the player sees and play along.
  function gameState() {
    return {day: dayKey, difficulty: tier, size: n, rows: Array.from({length: n}, (_, r) => cells.slice(r * n, r * n + n).join('')),
            moves: moveLog.slice(), left: remaining(), cleared: isClear(cells), lost};
  }
  const squareIndex = name => {
    const m = /^([A-Z])(\d+)$/.exec(String(name).trim().toUpperCase());
    return m ? (+m[2] - 1) * n + (m[1].charCodeAt(0) - 65) : -1;
  };
  window.HikuGame = {
    state: () => lesson === null && cells ? gameState() : null,
    open(t) { if (!TIERS.includes(t) || !todays) return false; if (lesson !== null) { tier = t; endLessons(); } else if (t !== tier) start(t); return true; },
    // One move as "B2-E2"; false when it is not a legal jump on the board as it stands.
    move(text) {
      if (lesson !== null || busy) return false;
      const [a, b] = String(text).split('-').map(squareIndex);
      return a >= 0 && b >= 0 && play(a, b, false);
    },
    restart() { if (lesson === null) start(tier); },
  };

  const mainEl = document.querySelector('main');
  function reportHeight() {
    if (parent !== window && !window.HIKU_PARAMS) parent.postMessage({type: 'hiku:height', height: mainEl.offsetTop + mainEl.offsetHeight}, '*');
  }
  new ResizeObserver(() => { reportHeight(); }).observe(mainEl);
  // Also once everything has loaded: a frame that is not yet painted gets no resize callbacks.
  addEventListener('load', reportHeight);
  let lastWidth = 0;
  new ResizeObserver(() => { if (boardEl.clientWidth !== lastWidth) { lastWidth = boardEl.clientWidth; if (cells) render(); } }).observe(boardEl);

  fetch(`https://hikupuzzle.com/api/daily?day=${dayKey}`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => { todays = data.boards; todaysHints = data.hints || {}; if (lesson === null) start(tier); reportHeight(); })
    .catch(() => { if (lesson === null) statusEl.textContent = T.offline; });
  // lessons=0 leaves the lessons to the "Learn to play" link: inside ChatGPT or Claude the game cannot remember a
  // player who has done them, and the assistant explains the rules itself.
  if (!store.get('learned') && !params.get('level') && params.get('lessons') !== '0') startLesson(0);
})();
</script>
<script>
// ?debug=1 shows every touch, pointer and click event at the top of the page, for finding lost taps on phones.
if (new URLSearchParams(location.search).get('debug') === '1') (function () {
  var box = document.createElement('div'), lines = [], t0 = performance.now();
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;font:11px/1.3 monospace;background:rgba(255,255,200,.95);color:#000;max-height:40vh;overflow:hidden;pointer-events:none;white-space:pre;padding:4px';
  document.body.appendChild(box);
  function log(text) { lines.unshift(Math.round(performance.now() - t0) + ' ' + text); lines = lines.slice(0, 18); box.textContent = lines.join('\n'); }
  ['touchstart', 'touchend', 'touchcancel', 'pointerdown', 'pointerup', 'pointercancel', 'click'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      var el = e.target, p = e.changedTouches ? e.changedTouches[0] : e;
      log(type + ' ' + ((el.className && el.className.baseVal === undefined ? el.className : el.tagName) || el.tagName) + ' "' + (el.textContent || '').trim().slice(0, 8) + '" y=' + Math.round(p.clientY) + (el.isConnected ? '' : ' (removed)'));
    }, true);
  });
  window.addEventListener('scroll', function () { log('scroll ' + Math.round(scrollY)); });
})();
</script>
