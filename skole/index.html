<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hiku-skolen</title>
<meta name="description" content="Hiku-skolen: lær å se fellene i Hiku. Sju korte leksjoner på små brett du spiller selv, og en prøve til slutt.">
<link rel="canonical" href="https://hikupuzzle.com/skole/">
<link rel="icon" href="../icon.png">
<script>try { var t = localStorage.getItem('hiku:site-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* The site's look: a navy band, cream tiles standing on a darker edge, and the gold dashed arc of a jump. */
:root{--bg:#f3eee6;--ink:#2b2f45;--muted:#5a5d6f;--rule:#ddd6ca;--tile:#fffaf2;--edge:#c4baa9;--cell:#dbd3c5;
  --navy:#3b4a7a;--navy-edge:#26305a;--on-navy:#f3eee6;--on-navy-muted:#c9cee6;--gold:#e0a43a;--link:#3b4a7a;
  --good:#2f7a4f;--good-soft:#dcefe2;--bad:#b4472f;--bad-soft:#f6e0d8;--card:#ece6db;--line:#efd9a6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d27;--ink:#ecebf2;--muted:#bdbfcc;--rule:#2d3040;--tile:#454b64;--edge:#161822;--cell:#2d3040;
  --navy:#262c48;--navy-edge:#151a30;--on-navy:#ecebf2;--on-navy-muted:#aeb4d4;--gold:#f2c66d;--link:#9fb0ea;
  --good:#7fd19f;--good-soft:#203a2b;--bad:#f0937c;--bad-soft:#41261f;--card:#222533;--line:#4a4226;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d27;--ink:#ecebf2;--muted:#bdbfcc;--rule:#2d3040;--tile:#454b64;--edge:#161822;--cell:#2d3040;
  --navy:#262c48;--navy-edge:#151a30;--on-navy:#ecebf2;--on-navy-muted:#aeb4d4;--gold:#f2c66d;--link:#9fb0ea;
  --good:#7fd19f;--good-soft:#203a2b;--bad:#f0937c;--bad-soft:#41261f;--card:#222533;--line:#4a4226;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--link)}
.wrap{max-width:720px;margin:0 auto;padding-inline:20px}
.band{background:var(--navy);color:var(--on-navy)}
.band nav{display:flex;align-items:center;gap:12px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--on-navy);font:400 24px Georgia,serif}
.brand img{width:30px;height:30px;border-radius:7px}
.band .langpick{margin-left:auto;font:inherit;font-size:14px;color:var(--on-navy);background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:4px 10px}
.band .langpick option{color:#2b2f45;background:#fffaf2}
/* A small scale: the school's name, the lesson's question, running text, and quiet labels. Spacing in 8, 16 and 24. */
.schoolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px}
h1{font:400 28px/1.15 Georgia,serif;letter-spacing:-.5px;margin:0}
.lessonpick{display:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--rule);padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.lessonpick::after{content:"";display:inline-block;width:7px;height:7px;margin:0 0 3px 10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg)}
.lessonpick[aria-expanded="true"]::after{transform:rotate(-135deg);margin-bottom:-1px}
.lead{font-size:15px;color:var(--muted);margin:8px 0 0;max-width:40em}
h2{font-weight:700;letter-spacing:-.02em;font-size:28px;line-height:1.2;margin:24px 0 8px;text-wrap:balance}
.cue{color:var(--muted);margin:0 0 16px;max-width:40em}
details.rule{margin:0 0 8px;font-size:15px;max-width:40em}
details.rule summary{cursor:pointer;font-weight:600;color:var(--link)}
details.rule p{color:var(--muted);margin:8px 0 0}
@media (max-width:600px){.lessonpick{display:block}.lead{display:none}h1{font-size:22px}h2{font-size:24px;margin-top:16px}}

/* One step at a time: an example, then the exercises. */
.stephead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress{display:flex;gap:5px;margin:0;list-style:none;padding:0}
.progress li{width:18px;height:6px;border-radius:3px;background:var(--rule)}
.progress li.done{background:var(--good)}
.progress li.now{background:var(--gold)}
.progress li.missed{background:var(--bad)}
.scores{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px}
.scores li.missed{color:var(--bad);font-weight:600}
.lead2{color:var(--muted)}
.step{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--rule);padding:16px;margin-bottom:24px}
.step .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.step h3{font-size:18px;margin:8px 0 0;text-wrap:balance}
.step p{margin:8px 0 0}
.step .text:empty{display:none}
.move{font-weight:650}
/* What to look for in a find exercise, so the trap and the safe move are never mixed up. */
.step .goal{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;margin:10px 0 4px;font-weight:650}
.goal .icon{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--card)}
.goal.trap{background:var(--bad-soft)}
.goal.trap .icon{background:var(--bad)}
.goal.safe{background:var(--good-soft)}
.goal.safe .icon{background:var(--good)}

/* The board: square names above and beside, cream tiles on grey squares, as in the game. */
.boardwrap{position:relative;width:min(100%,300px);margin:16px auto 8px}
.board{display:grid;gap:4px;user-select:none;-webkit-user-select:none}
.board .name{font-size:12px;font-weight:650;color:var(--muted);display:flex;align-items:center;justify-content:center}
.board .sq{aspect-ratio:1;border-radius:9px;background:var(--cell);border:0;padding:0;font:600 clamp(18px,6vw,26px) system-ui,sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:relative}
.board .sq.num{background:var(--tile);box-shadow:0 3px 0 var(--edge)}
.board button.sq{cursor:pointer}
.board button.sq:focus-visible{outline:3px solid var(--link);outline-offset:2px}
/* The number about to jump is gold, as a chosen number is in the game. */
.board .sq.from{background:var(--gold);color:#2b2f45;box-shadow:0 3px 0 var(--edge)}
.board .sq.target{outline:3px dashed var(--gold);outline-offset:-3px}
.board .sq.selected{background:var(--gold);color:#2b2f45;box-shadow:0 3px 0 var(--edge)}
/* Rings are outlines, drawn over the tile's own edge so they show all the way round. */
.board .sq.alone{outline:3px solid var(--bad);outline-offset:0;background:var(--bad-soft)}
.board .sq.picked{outline:3px solid var(--link);outline-offset:0}
.board .sq.dim{opacity:.4}
/* What a demonstration points at: the row and column of a number, the squares counted on a jump, a result that works. */
.board .sq.line{background:var(--line)}
.board .sq.line.num{background:var(--tile);outline:3px solid var(--line);outline-offset:0}
.board .sq.good{outline:3px solid var(--good);outline-offset:0;background:var(--good-soft)}
/* A counted square: a small dark tag with its count in the corner, never mistaken for a number on the board. */
.board .sq .count{position:absolute;bottom:4px;left:4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--navy);color:var(--on-navy);font:700 12px/20px system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.board .sq.counted:not(.num){background:var(--line)}
/* A demonstration's sentence: plain text over its button, with room for three lines so the button and the board below
   stay put from one sentence to the next. */
.step .feedback.telling,.whyextra .saying{min-height:4.8em}
.step .feedback.telling{background:none;padding:0;border-radius:0;margin-top:8px}
.telling .now,.saying .now{margin:0}
details.earlier{margin-top:0;font-size:14px;color:var(--muted)}
details.earlier summary{cursor:pointer;color:var(--link);font-weight:600}
details.earlier ol{margin:6px 0 0;padding-left:20px}
.boardlabel{min-height:1.4em}
.arc{position:absolute;inset:0;pointer-events:none;overflow:visible}
/* The sum of a jump over the square it landed on, as in the game. */
.eq{position:absolute;z-index:3;background:var(--navy);color:var(--on-navy);font-weight:650;padding:5px 11px;border-radius:10px;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;font-size:15px}
.arc path{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round}
.arc polygon{fill:var(--gold)}
.boardlabel{text-align:center;font-size:13px;font-weight:650;color:var(--muted);margin:0}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.btn{font:inherit;font-weight:650;font-size:16px;padding:11px 18px;border-radius:13px;border:0;cursor:pointer;background:var(--tile);color:var(--ink);box-shadow:0 4px 0 var(--edge);min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.main{background:var(--navy);color:var(--on-navy);box-shadow:0 4px 0 var(--navy-edge)}
.btn[aria-pressed="true"]{box-shadow:0 4px 0 var(--edge),0 0 0 3px var(--link)}
.feedback{border-radius:12px;padding:12px 16px;margin-top:16px}
/* Room for the answer before it comes, and a row of buttons that keeps its height, so nothing jumps when they change. */
.feedback:empty{padding:0;margin:0}
.step .feedback.telling:empty{display:block;visibility:hidden}
.step .actions{min-height:48px}
.extras{display:grid;gap:8px;margin-top:8px}
.extras:empty{display:none}
.feedback.good{background:var(--good-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback.info{background:var(--cell)}
.feedback .verdict{font-weight:750;margin:0 0 4px}
.feedback.good .verdict{color:var(--good)}
.feedback.bad .verdict{color:var(--bad)}
.feedback .why{margin:0}
/* The habit to take away, below the answer, quieter than it. */
details.recall{margin:12px 4px 0;font-size:15px}
details.recall summary{cursor:pointer;font-weight:600;color:var(--link)}
details.recall p{color:var(--muted);margin:6px 0 0}
details.more{margin-top:8px;font-size:15px}
details.more summary{cursor:pointer;font-weight:600;color:var(--link)}
details.more p{color:var(--muted);margin:6px 0 0}
/* The lessons: a wrapping row on a wide screen; on a phone a list that "Leksjon 3 av 8" opens. */
.lessons{margin-top:16px}
.lessons ol{list-style:none;padding:2px 0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:600px){.lessons{display:none;margin-top:8px}.lessons.open{display:block}.lessons ol{flex-direction:column}.lessons button{width:100%}}
.lessons button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:6px 14px 6px 6px;min-height:40px;cursor:pointer;
  background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;gap:8px;white-space:nowrap}
.lessons button .no{width:26px;height:26px;border-radius:50%;background:var(--cell);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums}
.lessons button.done .no{background:var(--good);color:var(--card)}
.lessons button[aria-current="true"]{background:var(--navy);color:var(--on-navy);box-shadow:none}
.lessons button[aria-current="true"] .no{background:var(--on-navy);color:var(--navy)}
.steplist{margin:6px 0 0;padding-left:22px}
.done-note{text-align:center;color:var(--muted)}
footer{margin-top:40px;padding-block:18px;border-top:1px solid var(--rule);color:var(--muted);font-size:13px}
</style>
</head>

<header class="band"><div class="wrap"><nav><a class="brand" href="/"><img src="/icon.png" alt="">Hiku</a><select class="langpick" id="langpick" aria-label="Språk"></select></nav></div></header>
<main class="wrap">
<div class="schoolbar"><h1 data-t="h1">Hiku-skolen</h1><button type="button" class="lessonpick" id="lessonpick" aria-expanded="false" aria-controls="lessonnav"></button></div>
<p class="lead" data-t="lead">Her øver du på å se fellene før du går i dem. Hver leksjon er et spørsmål du kan stille deg selv før du flytter.</p>

<nav class="lessons" id="lessonnav" aria-label="Leksjoner" data-t-label="lessons"><ol id="lessons"></ol></nav>
<section aria-labelledby="lesson-title">
<h2 id="lesson-title"></h2>
<p class="cue" id="lesson-cue"></p>
<div id="steps"></div>
<details class="rule" id="lesson-more"><summary id="lesson-more-label"></summary><p id="lesson-more-text"></p></details>
</section>
</main>
<footer><div class="wrap" data-t="footer">Hiku-skolen er under arbeid. Forklaringene kommer fra den samme motoren som «Hvorfor?» i spillet.</div></footer>

// One address for every language: ?lang= from the link (or the menu below), else the browser's language, else Norwegian.
const LANGS = ["nb", "en", "sv", "da", "fi", "de"];
const LANG = (() => {
  const asked = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(asked)) return asked;
  for (const l of navigator.languages || [navigator.language || ""]) {
    const code = l.toLowerCase().slice(0, 2);
    if (code === "no" || code === "nn" || code === "nb") return "nb";
    if (LANGS.includes(code)) return code;
  }
  return "nb";
})();

const PIECES = new Set(["list.and", "squares", "squares.one", "follow.jumps", "follow.lands", "sum.vanish", "move.short", "move", "tile", "undo"]);
const tr = (k, vars = {}) => {
  const t = ((TEXT[LANG] || {})[k] ?? TEXT.nb[k]).replace(/\{(\w+)\}/g, (_, v) => vars[v]);
  return PIECES.has(k) ? t : t.charAt(0).toLocaleUpperCase(LANG) + t.slice(1);
};

/** Whether the number on square i takes part in no jump, from or onto it, in any position that can be reached;
 *  false also when the search grows too large to be sure. */
function neverMoves(cells, n, i, limit = 30_000) {
  const seen = new Set([cells.join()]), stack = [cells];
  while (stack.length) {
    const p = stack.pop();
    for (let a = 0; a < p.length; a++) for (const t of targets(p, n, a)) {
      if (a === i || t === i) return false;
      const q = moved(p, a, t), key = q.join();
      if (seen.has(key)) continue;
      if (seen.size >= limit) return false;
      seen.add(key); stack.push(q);
    }
  }
  return true;
}

/** Where the engine points, for a lesson's question: the numbers a player should have tapped. */
const ANSWERS = {
  alone: (e, n, after) => alone(n, after),
  // The number the engine names, and any other it points at that, searched for here, never takes part in a jump again.
  meet: (e, n, after) => e.focus.filter((i, k) => k === 0 || neverMoves(after, n, i)),
  partner: e => [e.focus[0]],
  parity: e => e.focus,
};

      for (let c = 0; c < n; c++) {

    wrap.querySelectorAll(".eq").forEach(e => e.remove());

    const sumFor = drawing + 1;

      const above = to - n >= 0 && cells[to - n], below = to + n < cells.length && cells[to + n];
      const right = to % n < n - 1 && !cells[to + 1];
      if (above && !below) { eq.style.top = r.bottom - box.top + 4 + "px"; eq.style.transform = "translate(-50%, 0)"; }
      else if (above && below) {
        // Numbers above and below: beside the square instead, on the side that is free.
        eq.style.top = r.top - box.top + r.height / 2 + "px";
        eq.style.left = (right ? r.right - box.left + 6 : r.left - box.left - 6) + "px";
        eq.style.transform = right ? "translate(0, -50%)" : "translate(-100%, -50%)";
      }
      else eq.style.top = r.top - box.top - 4 + "px";
      wrap.append(eq);
    });
    // Drawn once the squares are laid out, and only if no other board has been drawn since.
    const drawn = ++drawing;
    // One arc, or a list of them: every place a chosen number can jump.
    const arcs = !arc ? [] : Array.isArray(arc[0]) ? arc : [arc];
    if (arcs.length) requestAnimationFrame(() => {
      if (drawn !== drawing) return;
      const box = wrap.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
      svg.innerHTML = arcs.map(a => drawArc(box, a)).join("");
    });
  }
  let drawing = 0;
  function drawArc(box, [from, to]) {
    const a = squares[from].getBoundingClientRect(), b = squares[to].getBoundingClientRect();
    const x1 = a.left + a.width / 2 - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left + b.width / 2 - box.left, y2 = b.top + b.height / 2 - box.top;
    // A bow over the jump, bent to one side, the way a number jumps in the game.
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, bend = a.width * 1.4;
    // Up over a jump along a row, out to the left of a jump along a column.
    const qx = dx === 0 ? mx - bend : mx, qy = dx === 0 ? my : my - bend;
    // From the edge of one tile to the edge of the other, so the bow never hides a number.
    const edge = (x, y) => { const d = Math.hypot(qx - x, qy - y) || 1, r = a.width * .5; return [x + (qx - x) / d * r, y + (qy - y) / d * r]; };
    const [sx, sy] = edge(x1, y1), [ex, ey] = edge(x2, y2);
    const ang = Math.atan2(ey - qy, ex - qx), s = 8;
    return `<path d="M${sx} ${sy} Q${qx} ${qy} ${ex} ${ey}"/>` +
      `<polygon points="${ex + Math.cos(ang) * s},${ey + Math.sin(ang) * s} ${ex + Math.cos(ang + 2.3) * s},${ey + Math.sin(ang + 2.3) * s} ${ex + Math.cos(ang - 2.3) * s},${ey + Math.sin(ang - 2.3) * s}"/>`;
  }
  return {draw};
}

function verdict(box, cls, head, why, steps = [], more = "", moreLabel = tr("more")) {
  box.className = "feedback " + cls;
  box.innerHTML = `<p class="verdict"></p>` + (why ? `<p class="why"></p>` : "");
  box.querySelector(".verdict").textContent = head;
  if (why) box.querySelector(".why").textContent = why;
  if (steps.length) {
    const ol = document.createElement("ol"); ol.className = "steplist";
    for (const t of steps) { const li = document.createElement("li"); li.textContent = t; ol.append(li); }
    box.append(ol);
  }
  // The whole proof is there for whoever wants it, behind a button.
  if (more) {
    box.insertAdjacentHTML("beforeend", `<details class="more"><summary>${moreLabel}</summary><p></p></details>`);
    box.querySelector(".more p").textContent = more;
  }
  inSight(box);
}

/** Scrolls so an element's foot is on the screen, without taking its card's top off it. */
function inSight(el) {
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect(), card = (el.closest(".step") || el).getBoundingClientRect();
    if (r.bottom > innerHeight) scrollBy({top: Math.max(0, Math.min(card.top - 12, r.bottom - innerHeight + 24)), behavior: "smooth"});
  });
}

/** The engine's own words for a move, with the board they are about (before or after it), or null when it has none. */
function explain(n, cells, from, to) {
  const e = trap(cells, n, {from, to, jumper: cells[from], target: cells[to]});
  // There is no undo button at school: its advice to undo is left out.
  const why = say(e ? e.reason : {plain: ""}, LANG).replace(new RegExp(tr("undo"), "g"), "");
  return e && {kind: e.kind, focus: e.focus, cells: e.cells, head: say(e.headline, LANG), why,
    steps: (e.steps || []).map(st => say(st.text, LANG))};
}

const Cap = t => t[0].toUpperCase() + t.slice(1);
const ruter = d => tr(d === 1 ? "squares.one" : "squares", {d});

/**
 * What a trap does, said in a sentence or two about this board, with the numbers to mark on the board after the move.
 * The engine's whole proof goes behind "Vis hele forklaringen". Each sentence only says what the engine proved.
 */
function teach(e, n, cells, after, from, to) {
  const marks = {}, more = [e.head, e.why].filter(Boolean).join(" ");
  const f = e.focus;
  switch (e.kind) {
    case "stranded": {
      const x = f[0]; marks[x] = "alone";
      // The numbers in its row and column that this move took away: they were its last ones.
      const gone = [from, to].filter(i => i !== x && cells[i] && !after[i] && inLine(n, i, x)).sort((p, q) => p - q);
      const names = gone.map(i => num(n, cells, i));
      return {marks, more, text: tr("alone", {x: num(n, after, x)}) + " " +
        (gone.length === 1 ? tr("alone.one", {a: names[0]}) : gone.length === 2 ? tr("alone.two", {a: names[0], b: names[1]}) : tr("alone.none"))};
    }
    case "unreachable": {
      const [a, m] = f, d = Math.abs(a % n - m % n) + Math.abs(Math.floor(a / n) - Math.floor(m / n));
      marks[a] = "alone"; marks[m] = "alone";
      return {marks, more, count: [a, m], text: tr("meet", {a: num(n, after, a), b: num(n, after, m), apart: ruter(d), d})};
    }
    case "shared": {
      const [c, x, y] = f; marks[x] = "alone"; marks[y] = "alone"; marks[c] = "good";
      return {marks, more, text: tr("partner", {x: num(n, after, x), y: num(n, after, y), c: num(n, after, c)})};
    }
    case "oddGroup": {
      for (const i of f) marks[i] = "alone";
      const vals = f.map(i => after[i]), sum = vals.reduce((a, b) => a + b, 0);
      return {marks, more: tr("parity.why"), moreLabel: tr("why"), text: tr("parity", {sum: `${vals.join(" + ")} = ${sum}`})};
    }
    case "needsSquare": {
      const [, square, x] = f; marks[square] = "alone"; marks[x] = "picked";
      return {marks, text: e.head + " " + tr("needs"), why: {square,
        until: ([a, b]) => (a === x && b === square) || (a === square && b === x),
        at: tr("needs.at", {sq: sq(n, square)}), end: tr("needs.end", {sq: sq(n, square)})}};
    }
    case "wrongMoment": {
      marks[to] = "alone";
      return {marks, steps: e.steps.length ? [tr("early.first"), ...e.steps] : [], text: e.head, why: {square: to,
        until: ([a, b]) => a === from && b === to,
        at: tr("early.at", {x: num(n, cells, from), sq: sq(n, to)}), end: tr("early.end", {x: num(n, cells, from), sq: sq(n, to)})}};
    }
    case "follow": {
      // Told of the square, since what stands there changes on the way: what ends up there, and that nobody clears it.
      const start = f[0], way = wayToStuck(after, n, start) || [];
      marks[start] = "alone";
      if (!way.length) return {marks, way: start, text: tr("follow.stuck", {x: num(n, after, start)})};
      let p = after.slice(), token = start;
      const said = [];
      for (const [a, z] of way) {
        said.push(tr(a === token ? "follow.jumps" : "follow.lands", {x: num(n, p, a), sq: sq(n, z)}));
        p = moved(p, a, z); token = a === token ? z : token;
      }
      return {marks, way: start, text: tr("follow", {start: sq(n, start), steps: list(said), v: p[token], end: sq(n, token)})};
    }
    default:
      for (const i of f) if (after[i]) marks[i] = "alone";
      return {marks, more, text: e.head};
  }
}

/**
 * The way one number goes to where it gets stuck, as moves that can be played on the board one after another, or
 * null when the follow graph's way cannot be played out from this board as it stands. The same as
 * tools/school/way.mjs, which the candidate search uses (keep the two the same).
 */
function wayToStuck(cells, n, start) {
  const graph = followGraph(cells, n, start);
  if (!graph) return null;
  const seen = new Set();
  function go(p, token, path) {
    const node = `${token},${p[token]}`, out = graph.get(node);
    if (!out) return null;
    if (!out.size) return path;
    if (seen.has(node) || path.length > 4) return null;
    seen.add(node);
    for (const [to, step] of out) {
      const [t] = to.split(",").map(Number);
      for (const [a, z] of step.jump ? [[token, t]] : [...step.who].map(w => [w, token])) {
        if (!targets(p, n, a).includes(z)) continue;
        const q = moved(p, a, z), next = a === token ? z : token;
        if (`${next},${q[next]}` !== to) continue;
        const r = go(q, next, [...path, [a, z]]);
        if (r) return r;
      }
    }
    seen.delete(node);
    return null;
  }
  return go(cells.slice(), start, []);
}

/** "Vis hvorfor" for a number that is never cleared: its way on the board, jump by jump, to where it is stuck. */
function offerWay(fb, b, label, n, after, t, back) {
  if (!t || t.way == null) return;
  const way = wayToStuck(after, n, t.way);
  if (!way || !way.length) return;
  const row = document.createElement("div");
  row.className = "actions whyextra";
  row.innerHTML = `<button type="button" class="btn">Vis hvorfor</button>`;
  fb.parentElement.querySelector(".extras").prepend(row);
  row.firstChild.onclick = () => {
    row.remove();
    const box = document.createElement("div");
    box.className = "feedback info whyextra";
    box.innerHTML = `<div class="saying"></div><div class="actions"></div>`;
    fb.parentElement.querySelector(".extras").prepend(box);
    let p = after.slice(), token = t.way, k = 0, sum = null;
    const said = [tr("way.intro", {x: num(n, p, token)})];
    const frame = () => {
      const coming = way[k] || null, marks = {[token]: coming ? "picked" : "alone"};
      if (coming) marks[coming[0]] = "from";
      b.draw(p, {marks, sum, arc: coming});
      label.textContent = tr("way.label");
      tell(box.querySelector(".saying"), said);
      const acts = box.querySelector(".actions"); acts.innerHTML = "";
      const go = document.createElement("button");
      go.type = "button"; go.className = "btn main"; go.textContent = coming ? tr("show.jump") : tr("back.answer");
      go.onclick = () => {
        if (!coming) { box.remove(); back(); offerWay(fb, b, label, n, after, t, back); return; }
        const [a, z] = coming;
        said.push(tr("jump", {x: num(n, p, a), y: num(n, p, z), sum: sumText(p[a], p[z])}));
        sum = [z, p[a], p[z]]; p = moved(p, a, z); token = a === token ? z : token; k++;
        if (k === way.length) said.push(tr("way.end", {x: num(n, p, token)}));
        frame();
      };
      acts.append(go);
    };
    frame();
  };
}

/**
 * The sentence for this step, in a box of steady height so the button below it stays where it is; the ones before
 * are folded away under "Tidligere steg".
 */
function tell(host, said, past = host) {
  host.innerHTML = `<p class="now"></p>`;
  host.firstChild.textContent = said[said.length - 1];
  if (past !== host) past.querySelector(".earlier")?.remove();
  if (said.length > 1) {
    const d = document.createElement("details"); d.className = "earlier";
    d.innerHTML = `<summary>${tr("earlier")}</summary><ol></ol>`;
    for (const t of said.slice(0, -1)) { const li = document.createElement("li"); li.textContent = t; d.lastChild.append(li); }
    past.append(d);
  }
}

/** One way to clear the board, found with the solver: a list of [from, to], or null when the solver cannot tell. */
function solutionLine(n, cells) {
  const line = [], memo = new Map();
  let p = cells.slice();
  while (p.some(Boolean)) {
    let next = null;
    for (let i = 0; i < p.length && !next; i++) for (const t of targets(p, n, i)) {
      const q = moved(p, i, t);
      if (q.every(v => !v) || solvable(q, n, memo, 500_000) === true) { next = [i, t]; break; }
    }
    if (!next) return null;
    line.push(next); p = moved(p, next[0], next[1]);
  }
  return line;
}

const sumText = (a, b) => a === b ? tr("sum.vanish", {a, b}) : `${Math.max(a, b)} − ${Math.min(a, b)} = ${Math.abs(a - b)}`;

/**
 * "Vis hvorfor" for a move that emptied a needed square or came too early: one real way to clear the board from before
 * the move, jump by jump on the board, up to where that square is used; framed as one way, since the engine proved
 * only that every way uses the square so. "Tilbake til svaret" puts the answer back.
 */
function offerWhy(fb, b, label, n, cells, t, back) {
  if (!t || !t.why) return;
  const line = solutionLine(n, cells), end = line ? line.findIndex(t.why.until) : -1;
  if (end < 0) return;
  const row = document.createElement("div");
  row.className = "actions whyextra";
  row.innerHTML = `<button type="button" class="btn">Vis hvorfor</button>`;
  fb.parentElement.querySelector(".extras").prepend(row);
  row.firstChild.onclick = () => {
    row.remove();
    const box = document.createElement("div");
    box.className = "feedback info whyextra";
    box.innerHTML = `<div class="saying"></div><div class="actions"></div>`;
    fb.parentElement.querySelector(".extras").prepend(box);
    let p = cells.slice(), k = 0, sum = null;
    const said = [tr("example.intro", {sq: sq(n, t.why.square)})];
    const frame = () => {
      // The whole way, to an empty board, so it is seen to work; the square is marked while it is in use.
      const marks = {}, coming = k < line.length ? line[k] : null;
      if (k <= end) marks[t.why.square] = "picked";
      if (coming) marks[coming[0]] = "from";
      b.draw(p, {marks, sum, arc: coming});
      label.textContent = tr("example.label");
      tell(box.querySelector(".saying"), said);
      const acts = box.querySelector(".actions"); acts.innerHTML = "";
      const go = document.createElement("button");
      go.type = "button"; go.className = "btn main"; go.textContent = coming ? tr("show.jump") : tr("back.answer");
      go.onclick = () => {
        if (!coming) { box.remove(); back(); offerWhy(fb, b, label, n, cells, t, back); return; }
        const [a, z] = coming;
        said.push(tr("jump", {x: num(n, p, a), y: num(n, p, z), sum: sumText(p[a], p[z])}) + (k === end ? " " + t.why.at : ""));
        sum = [z, p[a], p[z]]; p = moved(p, a, z); k++;
        if (k === line.length) said.push(tr("empty") + " " + t.why.end);
        frame();
      };
      acts.append(go);
    };
    frame();
  };
}

/** The board the move leaves, with its sum, and what the short words point at. */
function showResult(b, label, n, cells, after, t, extra = {}, move = null) {
  const marks = {...(t ? t.marks : {}), ...extra};
  if (!t && lesson.id === "alone") for (const i of alone(n, after)) marks[i] = "alone";
  let counts = null;
  if (t && t.count) {
    const [a, z] = t.count, step = Math.floor(z / n) === Math.floor(a / n) ? Math.sign(z - a) : Math.sign(z - a) * n;
    counts = {}; for (let i = a + step, c = 1; ; i += step, c++) { counts[i] = c; if (i === z) break; }
  }
  b.draw(after, {marks, counts, sum: move ? [move[1], cells[move[0]], cells[move[1]]] : null});
  label.textContent = tr("after");
}

function recall(host) {
  const extras = host.parentElement.querySelector(".extras");
  extras.insertAdjacentHTML("beforeend", `<details class="recall"><summary>${tr("recall")}</summary><p></p></details>`);
  extras.lastElementChild.querySelector("p").textContent = lesson.recall;
}

/** A wrong first answer: it counts as missed, though the step is not done yet. */
function miss(k) {
  if (!(k in saved.first)) { saved.first[k] = false; store(); }
}
const extraAt = {};

let nextStep = () => {}, nextLabel = "";

/** Where the step card stands on the screen now, or null when there is none. */
const cardTop = () => stepsEl.firstElementChild ? stepsEl.firstElementChild.getBoundingClientRect().top : null;

/**
 * The new step card in place of the old, where the old one stood on the screen, so the page does not jump: the
 * list keeps its height while they swap, and a card whose top was above the screen is shown from its top.
 */
function place(el, was) {
  stepsEl.style.minHeight = stepsEl.offsetHeight + "px";
  stepsEl.replaceChildren(el);
  // Released once the new card has its board and buttons, which are filled in after this.
  requestAnimationFrame(() => { stepsEl.style.minHeight = ""; });
  if (was == null) return;
  const d = el.getBoundingClientRect().top - Math.max(was, 12);
  if (d) scrollBy(0, d);
}

function finish(k, firstTry) {
  if (!(k in saved.first)) saved.first[k] = firstTry;
  if (!saved.done.includes(k)) saved.done.push(k);
  store(); drawProgress(); drawLessons();
  // "Neste" in the same row as the answer buttons, after them, so nothing below the board moves.
  const acts = stepsEl.querySelector(".step .actions");
  if (acts && !acts.querySelector(".next")) {
    const next = document.createElement("button");
    next.type = "button"; next.className = "btn main next"; next.textContent = nextLabel;
    next.onclick = () => nextStep();
    acts.append(next);
  }
}

/**
 * A demonstration: one sentence at a time with what happens on the board. Each frame may start again from the
 * board as it was (reset: the moves to play from there), play a move, point at squares (marks), light a number's row
 * and column (line), count the squares of a jump (count) or draw one (arc). "go" is the button that leads to it.
 * Every move is checked against the rules as it is played, so a demonstration cannot show a jump the game forbids.
 */
function demo(k, s, b, label, acts, fb) {
  const el = acts.closest(".step"), n = s.n, start = s.cells.slice(), said = [];
  let cells = start.slice(), f = 0;
  const playOn = (c, mv) => {
    const [a, t] = mv.split("-").map(x => at(n, x));
    if (!targets(c, n, a).includes(t)) throw new Error(`not a legal jump: ${mv}`);
    return moved(c, a, t);
  };
  const frame = () => {
    const fr = s.frames[f];
    if (fr.reset) { cells = fr.reset.reduce(playOn, start.slice()); said.length = 0; }
    let sum = null;
    if (fr.play) { const [a, t] = fr.play.split("-").map(x => at(n, x)); sum = [t, cells[a], cells[t]]; cells = playOn(cells, fr.play); }
    const marks = {}, counts = {};
    if (fr.line) { const c = at(n, fr.line); cells.forEach((_, i) => { if (i !== c && inLine(n, i, c)) marks[i] = "line"; }); }
    for (const [name, cls] of Object.entries(fr.marks || {})) marks[at(n, name)] = cls;
    if (fr.count) {
      const [a, z] = fr.count.map(x => at(n, x)), step = Math.floor(z / n) === Math.floor(a / n) ? Math.sign(z - a) : Math.sign(z - a) * n;
      for (let i = a + step, c = 1; ; i += step, c++) { counts[i] = c; if (i === z) break; }
    }
    // The jump the next button plays is shown before it is played: the number in gold, the arc to where it lands.
    const coming = s.frames[f + 1] && !s.frames[f + 1].reset && s.frames[f + 1].play;
    const arcs = [];
    if (fr.arc) arcs.push(fr.arc.map(x => at(n, x)));
    if (coming) { const [a, t] = coming.split("-").map(x => at(n, x)); marks[a] = "from"; arcs.push([a, t]); }
    b.draw(cells, {marks, counts, sum, arc: arcs.length ? arcs : null});
    label.textContent = fr.label || "";
    said.push(fr.text);
    fb.className = "feedback info";
    fb.classList.add("telling");
    tell(fb, said, el.querySelector(".extras"));
    const next = s.frames[f + 1];
    acts.innerHTML = "";
    if (next) {
      const go = document.createElement("button");
      go.type = "button"; go.className = "btn main"; go.textContent = next.go || tr("on");
      go.onclick = () => { f++; frame(); inSight(el); };
      acts.append(go);
    } else finish(k, true);
  };
  frame();
}

const moveText = (n, cells, from, to) => tr("move", {x: num(n, cells, from), sq: sq(n, to)});

function show(k, extra = null) {
  current = k; drawProgress();
  const steps = lesson.steps, s = extra || steps[k], n = s.n, cells = s.cells.slice();
  const was = cardTop();
  const el = document.createElement("article"); el.className = s.type === "demo" ? "step demo" : "step";
  const label = s.type === "example" || s.type === "demo" ? tr("label.example") : extra ? tr("label.similar") : tr("label.task", {k, n: steps.length - 1});
  const banner = s.type === "findTrap" ? `<p class="goal trap"><span class="icon" aria-hidden="true">✕</span><span>${tr("goal.trap")}</span></p>`
    : s.type === "solve" ? `<p class="goal safe"><span class="icon" aria-hidden="true">✓</span><span>${tr("goal.solve")}</span></p>`
    : s.type === "findSafe" ? `<p class="goal safe"><span class="icon" aria-hidden="true">✓</span><span>${tr("goal.safe")}</span></p>` : "";
  el.innerHTML = `<div class="stephead"><p class="kind">${label}</p><ol class="progress" id="progress" aria-label="${tr("progress")}"></ol></div>${s.title ? "<h3></h3>" : ""}${banner}<p class="text"></p><div class="feedback" aria-live="polite"></div><div class="actions"></div><div class="host"></div><p class="boardlabel"></p><div class="extras"></div>`;
  const from = s.move ? at(n, s.move[0]) : -1, to = s.move ? at(n, s.move[1]) : -1;
  const mv = s.move ? moveText(n, cells, from, to) : "";
  if (s.title) el.querySelector("h3").textContent = s.title;
  el.querySelector(".text").textContent = s.text || {
    demo: "",
    example: tr("text.example", {mv}),
    predict: lesson.ask.replace("{move}", mv),
    findTrap: tr("text.findTrap"), findSafe: tr("text.findSafe"), solve: tr("text.solve")}[s.type];
  place(el, was);
  drawProgress();

  const b = board(el.querySelector(".host"), n), label2 = el.querySelector(".boardlabel"), acts = el.querySelector(".actions"), fb = el.querySelector(".feedback");
  nextStep = () => k < steps.length - 1 ? show(k + 1) : allDone();
  nextLabel = k === steps.length - 1 ? tr("done") : tr("next");

  if (s.type === "demo") return demo(k, s, b, label2, acts, fb);
  // In an exercise the question and its buttons stand above the board, and the answer comes under the board.
  label2.after(fb);

  if (s.type === "example" || s.type === "predict") {
    const after = moved(cells, from, to), ok = solvable(after, n, new Map(), 500_000), e = ok ? null : explain(n, cells, from, to);
    label2.textContent = tr("move.label", {mv});
    const reveal = picked => {
      if (s.type === "example") {
        const t = e && teach(e, n, cells, after, from, to);
        showResult(b, label2, n, cells, after, t, {}, [from, to]);
        verdict(fb, "info", t ? t.text : "", "", t ? t.steps || [] : [], t ? t.more : "", t && t.moreLabel);
        return finish(k, true);
      }
      const right = judge(picked);
      const t = e && teach(e, n, cells, after, from, to);
      showResult(b, label2, n, cells, after, t, picked >= 0 && !(t && t.marks[picked]) ? {[picked]: "picked"} : {}, [from, to]);
      verdict(fb, right ? "good" : "bad", right ? tr("right") : tr("notquite"), t ? t.text : lesson.none, t ? t.steps || [] : [], t ? t.more : "", t && t.moreLabel);
      recall(fb);
      offerWhy(fb, b, label2, n, cells, t, () => showResult(b, label2, n, cells, after, t, {}, [from, to]));
      offerWay(fb, b, label2, n, after, t, () => showResult(b, label2, n, cells, after, t, {}, [from, to]));
      // Missed once: before going on, one more of the same kind on a new board, so the answer just seen gets used.
      if ((!right || missed) && !extra && lesson.extra && lesson.extra.length) {
        miss(k);
        acts.innerHTML = `<button type="button" class="btn main">${tr("similar")}</button>`;
        acts.firstChild.onclick = () => show(k, lesson.extra[extraAt[lesson.id] = ((extraAt[lesson.id] ?? -1) + 1) % lesson.extra.length]);
        return;
      }
      finish(k, right && !missed);
    };
    // Right or not, worked out by the solver and the engine, never written down.
    let missed = false;
    const judge = picked => {
      if (lesson.predict === "trap") return picked === (ok ? "safe" : "trap");
      const answers = e ? ANSWERS[lesson.id](e, n, after) : [];
      return answers.length ? answers.includes(picked) : picked === -1;
    };
    if (s.type === "example") {
      b.draw(cells, {marks: {[from]: "from"}, arc: [from, to]});
      acts.innerHTML = `<button type="button" class="btn main">Spill trekket</button>`;
      acts.firstChild.onclick = () => { acts.innerHTML = ""; reveal(null); };
      return;
    }
    let choice = null;
    if (lesson.predict === "trap") {
      // Safe or a trap: answered with the two buttons, and the move is played at once.
      b.draw(cells, {marks: {[from]: "from"}, arc: [from, to]});
      acts.innerHTML = `<button type="button" class="btn">${tr("safe")}</button><button type="button" class="btn">${tr("trap")}</button>`;
      const [safe, bad] = acts.children;
      const answer = a => {
        if (!judge(a) && !missed) { missed = true; miss(k); return verdict(fb, "bad", tr("think"), lesson.hint); }
        acts.innerHTML = ""; reveal(a);
      };
      safe.onclick = () => answer("safe");
      bad.onclick = () => answer("trap");
      return;
    }
    // Two plain steps: yes or no first; only on yes, which number, answered by tapping it. The move is played after.
    const answer = picked => {
      // A first wrong answer gets a hint and another try on the same board, the move still to come.
      if (!judge(picked) && !missed) {
        missed = true; miss(k);
        const marks = {[from]: "from"};
        if (lesson.id === "alone") cells.forEach((v, i) => { if (v && i !== from && inLine(n, i, from)) marks[i] = "line"; });
        b.draw(cells, {marks, arc: [from, to]});
        verdict(fb, "bad", tr("again"), lesson.hint);
        ask();
        return;
      }
      acts.innerHTML = ""; reveal(picked);
    };
    const ask = () => {
      acts.innerHTML = `<button type="button" class="btn">${tr("yes")}</button><button type="button" class="btn">${tr("no")}</button>`;
      const [yes, no] = acts.children;
      no.onclick = () => answer(-1);
      yes.onclick = () => {
        // Now the board takes the answer: every number but the one about to jump can be tapped.
        b.draw(cells, {marks: {[from]: "from"}, arc: [from, to], tap: i => i !== from && answer(i)});
        verdict(fb, "info", lesson.pick);
        acts.innerHTML = `<button type="button" class="btn">${tr("back")}</button>`;
        acts.firstChild.onclick = () => { b.draw(cells, {marks: {[from]: "from"}, arc: [from, to]}); fb.className = "feedback"; fb.innerHTML = ""; ask(); };
      };
    };
    b.draw(cells, {marks: {[from]: "from"}, arc: [from, to]});
    ask();
    return;
  }

  if (s.type === "solve") {
    let p = cells.slice(), chosen = null, lost = false;
    const redrawSolve = (sum = null) => {
      const marks = {};
      if (chosen != null) marks[chosen] = "selected";
      b.draw(p, {marks, sum, arc: chosen == null ? null : targets(p, n, chosen).map(t => [chosen, t]), tap: lost ? null : tapSolve});
    };
    function tapSolve(i) {
      if (chosen != null && targets(p, n, chosen).includes(i)) {
        const a = chosen, sum = [i, p[a], p[i]], before = p;
        chosen = null; p = moved(p, a, i);
        if (p.every(v => !v)) {
          redrawSolve(sum);
          verdict(fb, "good", tr("solved"), tr("solved.text"));
          return finish(k, !missed);
        }
        if (solvable(p, n, new Map(), 500_000) === false) {
          lost = true; missed = true; miss(k);
          const e = explain(n, before, a, i), t = e && teach(e, n, before, p, a, i);
          showResult(b, label2, n, before, p, t, {}, [a, i]);
          verdict(fb, "bad", tr("lost"), t ? t.text : tr("lost.text"));
          acts.innerHTML = `<button type="button" class="btn main">${tr("restart")}</button>`;
          acts.firstChild.onclick = () => { p = cells.slice(); lost = false; acts.innerHTML = ""; fb.className = "feedback"; fb.innerHTML = ""; label2.textContent = ""; redrawSolve(); };
          return;
        }
        fb.className = "feedback"; fb.innerHTML = "";
        return redrawSolve(sum);
      }
      chosen = targets(p, n, i).length ? i : null;
      if (chosen == null) verdict(fb, "info", tr("cannot", {x: num(n, p, i)}));
      redrawSolve();
    }
    let missed = false;
    redrawSolve();
    return;
  }

  // Find the trap, or the safe move: the player plays moves until the one asked for, and every other try is told.
  let selected = null, tries = 0;
  const goal = s.type;
  const redraw = () => {
    const marks = {};
    const arcs = selected == null ? null : targets(cells, n, selected).map(t => [selected, t]);
    if (selected != null) marks[selected] = "selected";
    b.draw(cells, {marks, arc: arcs, tap});
  };
  function tap(i) {
    if (selected != null && targets(cells, n, selected).includes(i)) return play(selected, i);
    selected = targets(cells, n, i).length ? i : null;
    if (selected == null) verdict(fb, "info", tr("cannot", {x: num(n, cells, i)}));
    redraw();
  }
  function play(from, to) {
    tries++; selected = null;
    // Saved at once, so leaving and coming back does not wipe out a wrong try.
    const won0 = ok => goal === "findTrap" ? !ok : ok;
    const after = moved(cells, from, to), ok = solvable(after, n, new Map(), 500_000);
    const Move = tr("move.short", {x: num(n, cells, from), sq: sq(n, to)});
    if (ok === null) { verdict(fb, "info", tr("unchecked")); return redraw(); }
    const e = ok ? null : explain(n, cells, from, to);
    // The move is shown as the explanation sees it, since that is what the words are about.
    const t = e && teach(e, n, cells, after, from, to);
    showResult(b, label2, n, cells, after, t, {}, [from, to]);
    if (!won0(ok)) miss(k);
    if (won0(ok)) {
      verdict(fb, "good", goal === "findTrap" ? tr("found.trap") : tr("found.safe"),
        t ? t.text : tr("still"), t ? t.steps || [] : [], t ? t.more : "", t && t.moreLabel);
      recall(fb);
      offerWhy(fb, b, label2, n, cells, t, () => showResult(b, label2, n, cells, after, t, {}, [from, to]));
      offerWay(fb, b, label2, n, after, t, () => showResult(b, label2, n, cells, after, t, {}, [from, to]));
      return finish(k, tries === 1);
    }
    if (goal === "findTrap") verdict(fb, "info", tr("tried.safe"), tr("tried.safe.text", {move: Move}));
    else verdict(fb, "bad", tr("tried.trap"), t ? t.text : tr("not.solvable"), t ? t.steps || [] : [], t ? t.more : "", t && t.moreLabel);
    offerWhy(fb, b, label2, n, cells, t, () => showResult(b, label2, n, cells, after, t, {}, [from, to]));
    offerWay(fb, b, label2, n, after, t, () => showResult(b, label2, n, cells, after, t, {}, [from, to]));
    acts.innerHTML = `<button type="button" class="btn">${tr("try.other")}</button>`;
    acts.firstChild.onclick = () => { acts.innerHTML = ""; fb.className = "feedback"; fb.innerHTML = ""; label2.textContent = ""; el.querySelectorAll(".whyextra").forEach(x => x.remove()); redraw(); };
  }
  redraw();
}

function allDone() {
  const k = LESSONS.indexOf(lesson), next = LESSONS[k + 1];
  stepsEl.innerHTML = `<article class="step"><p class="kind">${tr("lesson.n", {k: k + 1})}</p><h3>${tr("lesson.done")}</h3><p class="learned"></p><p class="how"></p><div class="actions"></div></article>`;
  // What was learned first, then how it went, told as encouragement: a retry is part of learning, not a failure.
  stepsEl.querySelector(".learned").textContent = lesson.learned;
  // The example is no exercise, so it is not counted.
  const asked = lesson.steps.map((s, i) => i).filter(i => !["example", "demo"].includes(lesson.steps[i].type));
  const right = asked.filter(i => saved.first[i]).length;
  stepsEl.querySelector(".how").textContent = asked.length < 2 ? tr("how.one")
    : right === asked.length ? tr("how.all") : right === 0 ? tr("how.none") : tr("how.some", {r: right, n: asked.length});
  const acts = stepsEl.querySelector(".actions");
  if (next) { acts.insertAdjacentHTML("beforeend", `<button type="button" class="btn main">${tr("next.lesson")}</button>`); acts.lastChild.onclick = () => { open(k + 1); scrollTo({top: 0}); }; }
  acts.insertAdjacentHTML("beforeend", `<button type="button" class="btn">${tr("redo")}</button>`);
  acts.lastChild.onclick = () => { saved.done = []; saved.first = {}; store(); drawLessons(); show(0); };
  current = lesson.steps.length; drawProgress();
}

// ---- The test

/** Which lesson teaches the pattern behind an explanation. */
const KIND_LESSON = {stranded: "alone", unreachable: "meet", shared: "partner", needsSquare: "order", wrongMoment: "order",
  oddGroup: "parity", follow: "ahead"};

/**
 * The final test: ten moves from every lesson, mixed and unnamed, each answered safe or trap with no hint; after each
 * the answer and why, at the end the score per pattern and a way back to the lessons missed. A trap counts for the
 * lesson its explanation belongs to, worked out by the engine; a safe move counts for none.
 */
function runTest() {
  // One trap per lesson and four safe moves, so answering "Felle" to everything does not pass.
  const COUNT = 10, TRAPS = 6;
  const pool = lesson.pool.map(q => ({...q})).sort(() => Math.random() - .5);
  const qs = [], perLesson = {}, taken = new Set();
  // First one trap from each lesson, then up to two, then safe moves to fill: every lesson is in the test.
  for (const most of [1, 2]) for (const q of pool) {
    if (qs.length >= COUNT || taken.has(q)) continue;
    const n = q.n, from = at(n, q.move[0]), to = at(n, q.move[1]), after = moved(q.cells, from, to);
    const ok = solvable(after, n, new Map(), 500_000);
    if (ok === null) continue;
    const e = ok ? null : explain(n, q.cells, from, to), home = e && KIND_LESSON[e.kind];
    if (!ok && !home) continue;
    const traps = qs.filter(x => !x.ok).length;
    if (ok ? qs.length - traps >= COUNT - TRAPS : traps >= TRAPS) continue;
    // At most two traps of one kind, so the test reaches every lesson it can.
    if (home && (perLesson[home] || 0) >= most) continue;
    if (home) perLesson[home] = (perLesson[home] || 0) + 1;
    taken.add(q);
    qs.push({...q, from, to, after, ok, e, home});
  }
  qs.sort(() => Math.random() - .5);
  const answers = [];
  const show = i => {
    const q = qs[i], n = q.n, cells = q.cells;
    const was = cardTop();
    const el = document.createElement("article"); el.className = "step";
    el.innerHTML = `<div class="stephead"><p class="kind">${tr("test.q", {i: i + 1, n: qs.length})}</p><ol class="progress" aria-label="${tr("progress")}">` +
      qs.map((_, j) => `<li class="${j < i ? (answers[j] ? "done" : "missed") : j === i ? "now" : ""}"></li>`).join("") + `</ol></div>` +
      `<h3>${tr("test.h")}</h3><p class="text"></p><div class="actions"></div><div class="host"></div><p class="boardlabel"></p><div class="feedback" aria-live="polite"></div>`;
    el.querySelector(".text").textContent = tr("test.text", {mv: moveText(n, cells, q.from, q.to)});
    place(el, was);
    const b = board(el.querySelector(".host"), n), label = el.querySelector(".boardlabel"), fb = el.querySelector(".feedback"), acts = el.querySelector(".actions");
    b.draw(cells, {marks: {[q.from]: "from"}, arc: [q.from, q.to]});
    label.textContent = tr("move.label", {mv: moveText(n, cells, q.from, q.to)});
    acts.innerHTML = `<button type="button" class="btn">Trygt</button><button type="button" class="btn">Felle</button>`;
    const answer = a => {
      const right = a === (q.ok ? "safe" : "trap");
      answers[i] = right;
      const t = q.e && teach(q.e, n, cells, q.after, q.from, q.to);
      showResult(b, label, n, cells, q.after, t, {}, [q.from, q.to]);
      const home = q.home && LESSONS.find(l => l.id === q.home);
      verdict(fb, right ? "good" : "bad", right ? tr("right") : q.ok ? tr("test.wrong.safe") : tr("test.wrong.trap"),
        q.ok ? tr("test.safe") : tr("test.pattern", {p: home.short, t: t ? t.text : ""}), t ? t.steps || [] : []);
      acts.innerHTML = `<button type="button" class="btn main">${i < qs.length - 1 ? tr("test.next") : tr("test.result")}</button>`;
      acts.firstChild.onclick = () => i < qs.length - 1 ? show(i + 1) : result();
    };
    acts.children[0].onclick = () => answer("safe");
    acts.children[1].onclick = () => answer("trap");
  };
  const result = () => {
    const right = answers.filter(Boolean).length, rows = {};
    qs.forEach((q, i) => { const key = q.home || "safe"; rows[key] ||= [0, 0]; rows[key][1]++; if (answers[i]) rows[key][0]++; });
    saved.best = Math.max(saved.best ?? 0, right); saved.last = right; store(); drawLessons();
    stepsEl.innerHTML = `<article class="step"><p class="kind">${tr("test.title")}</p><h3></h3><p class="lead2"></p><ul class="scores"></ul><div class="actions"></div></article>`;
    stepsEl.querySelector("h3").textContent = tr("test.score", {r: right, n: qs.length});
    stepsEl.querySelector(".lead2").textContent = right === qs.length ? tr("test.all") : right >= qs.length * .7 ? tr("test.good") : tr("test.more");
    const ul = stepsEl.querySelector(".scores"), acts = stepsEl.querySelector(".actions");
    const order = key => key === "safe" ? 99 : LESSONS.findIndex(l => l.id === key);
    for (const [key, [r, all]] of Object.entries(rows).sort((a, b) => order(a[0]) - order(b[0]))) {
      const l = LESSONS.find(x => x.id === key), li = document.createElement("li");
      li.textContent = tr("test.row", {p: l ? l.short : tr("test.safes"), r, n: all});
      if (r < all) li.className = "missed";
      ul.append(li);
      if (l && r < all) {
        const k = LESSONS.indexOf(l), go = document.createElement("button");
        go.type = "button"; go.className = "btn"; go.textContent = tr("test.practice", {p: l.short});
        go.onclick = () => { const st = load(l.key); st.done = [0]; try { localStorage.setItem(l.key, JSON.stringify(st)); } catch (e) {} open(k); scrollTo({top: 0}); };
        acts.append(go);
      }
    }
    const again = document.createElement("button");
    again.type = "button"; again.className = "btn main"; again.textContent = tr("test.again");
    again.onclick = () => runTest();
    acts.append(again);
  };
  if (!qs.length) { stepsEl.innerHTML = `<article class="step"><h3>${tr("test.none")}</h3></article>`; return; }
  show(0);
}

const fromHash = Number((location.hash.match(/^#leksjon-(\d+)$/) || [])[1]) - 1;
open(LESSONS[fromHash] ? fromHash : Math.max(0, LESSONS.findIndex(l => !finished(l))));
</script>
