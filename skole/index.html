/** Where the engine points, for a lesson's question: the numbers a player should have tapped. */
const ANSWERS = {
  alone: (e, n, after) => alone(n, after),
  meet: e => [e.focus[0]],
  partner: e => [e.focus[0]],
  parity: e => e.focus,
};

const lessonsEl = document.getElementById("lessons"), progress = document.getElementById("progress"), stepsEl = document.getElementById("steps");
let lesson, saved, current;
const load = key => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } };
const store = () => { try { localStorage.setItem(lesson.key, JSON.stringify(saved)); } catch (e) {} };
const finished = l => (load(l.key).done || []).length >= l.steps.length;

function drawLessons() {
  lessonsEl.innerHTML = "";
  LESSONS.forEach((l, k) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    b.textContent = `${k + 1}. ${l.short}`;
    if (finished(l)) b.insertAdjacentHTML("beforeend", `<span class="tick" aria-label="ferdig">✓</span>`);
    b.setAttribute("aria-current", String(l === lesson));
    b.onclick = () => open(k);
    li.append(b); lessonsEl.append(li);
  });
}

function open(k) {
  lesson = LESSONS[k];
  try { history.replaceState(null, "", `#leksjon-${k + 1}`); } catch (e) {}
  saved = load(lesson.key); saved.done ||= []; saved.first ||= {};
  document.getElementById("lesson-title").textContent = `${k + 1}. ${lesson.title}`;
  document.getElementById("lesson-rule").textContent = lesson.rule;
  document.getElementById("lesson-check").textContent = lesson.check;
  drawLessons();
  current = Math.min(saved.done.length, lesson.steps.length - 1);
  if (finished(lesson)) allDone(); else show(current);
}

function drawProgress() {
  progress.innerHTML = lesson.steps.map((_, k) => `<li class="${saved.done.includes(k) ? "done" : k === current ? "now" : ""}" aria-label="Steg ${k + 1}${saved.done.includes(k) ? ", ferdig" : ""}"></li>`).join("");
}

/** A board on the page: square names, numbers as tiles, an arc for a move, and taps on the squares when wanted. */
function board(host, n) {

  const grid = document.createElement("div"); grid.className = "board";
  grid.style.gridTemplateColumns = `18px repeat(${n}, 1fr)`;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "arc"); svg.setAttribute("aria-hidden", "true");
  wrap.append(grid, svg); host.append(wrap);
  let squares = [];
  function draw(cells, {marks = {}, arc = null, tap = null} = {}) {
    grid.innerHTML = "<span></span>" + [...Array(n)].map((_, c) => `<span class="name">${COLS[c]}</span>`).join("");
    squares = [];
    for (let r = 0; r < n; r++) {
      grid.insertAdjacentHTML("beforeend", `<span class="name">${r + 1}</span>`);
      for (let c = 0; c < n; c++) {
        const i = r * n + c, v = cells[i];
        const el = document.createElement(tap && v ? "button" : "div");
        el.className = "sq" + (v ? " num" : "") + (marks[i] ? " " + marks[i] : "");
        el.textContent = v || "";
        if (el.tagName === "BUTTON") { el.type = "button"; el.setAttribute("aria-label", `${v} på ${sq(n, i)}`); el.onclick = () => tap(i); }
        else if (v) el.setAttribute("aria-label", `${v} på ${sq(n, i)}`);
        grid.append(el); squares[i] = el;
      }
    }
    svg.innerHTML = "";
    // Drawn once the squares are laid out, and only if no other board has been drawn since.
    const drawn = ++drawing;
    // One arc, or a list of them: every place a chosen number can jump.
    const arcs = !arc ? [] : Array.isArray(arc[0]) ? arc : [arc];
    if (arcs.length) requestAnimationFrame(() => {
      if (drawn !== drawing) return;
      const box = wrap.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
      svg.innerHTML = arcs.map(a => drawArc(box, a)).join("");
    });
  }
  let drawing = 0;
  function drawArc(box, [from, to]) {
    const a = squares[from].getBoundingClientRect(), b = squares[to].getBoundingClientRect();
    const x1 = a.left + a.width / 2 - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left + b.width / 2 - box.left, y2 = b.top + b.height / 2 - box.top;
    // A bow over the jump, bent to one side, the way a number jumps in the game.
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, bend = a.width * 1.4;
    // Up over a jump along a row, out to the left of a jump along a column.
    const qx = dx === 0 ? mx - bend : mx, qy = dx === 0 ? my : my - bend;
    // From the edge of one tile to the edge of the other, so the bow never hides a number.
    const edge = (x, y) => { const d = Math.hypot(qx - x, qy - y) || 1, r = a.width * .5; return [x + (qx - x) / d * r, y + (qy - y) / d * r]; };
    const [sx, sy] = edge(x1, y1), [ex, ey] = edge(x2, y2);
    const ang = Math.atan2(ey - qy, ex - qx), s = 8;
    return `<path d="M${sx} ${sy} Q${qx} ${qy} ${ex} ${ey}"/>` +
      `<polygon points="${ex + Math.cos(ang) * s},${ey + Math.sin(ang) * s} ${ex + Math.cos(ang + 2.3) * s},${ey + Math.sin(ang + 2.3) * s} ${ex + Math.cos(ang - 2.3) * s},${ey + Math.sin(ang - 2.3) * s}"/>`;
  }
  return {draw};
}

function verdict(box, cls, head, why, steps = []) {
  box.className = "feedback " + cls;
  box.innerHTML = `<p class="verdict"></p>` + (why ? `<p class="why"></p>` : "");
  box.querySelector(".verdict").textContent = head;
  if (why) box.querySelector(".why").textContent = why;
  if (steps.length) {
    const ol = document.createElement("ol"); ol.className = "steplist";
    for (const t of steps) { const li = document.createElement("li"); li.textContent = t; ol.append(li); }
    box.querySelector(".why").before(ol);
    box.querySelector(".steplist").insertAdjacentHTML("beforebegin", `<p class="why">Før det må dette skje:</p>`);
  }
}

/** The engine's own words for a move, with the board they are about (before or after it), or null when it has none. */
function explain(n, cells, from, to) {
  const e = trap(cells, n, {from, to, jumper: cells[from], target: cells[to]});
  return e && {kind: e.kind, focus: e.focus, cells: e.cells, head: say(e.headline, LANG), why: say(e.reason, LANG),
    steps: (e.steps || []).map(st => say(st.text, LANG))};
}

/** The board a move leaves, or the one before it when that is what the explanation is about, with what it points at. */
function showResult(b, label, n, cells, after, e, extra = {}) {
  const before = e && same(e.cells, cells), marks = {...extra};
  if (e) for (const i of e.focus) marks[i] ||= "alone";
  else if (lesson.id === "alone") for (const i of alone(n, after)) marks[i] = "alone";
  b.draw(before ? cells : after, {marks});
  label.textContent = before ? "Før trekket ditt" : "Etter trekket";
}

function recall(host) {
  host.insertAdjacentHTML("afterend", `<details class="recall"><summary>Hva bør du sjekke før neste trekk?</summary><p></p></details>`);
  host.nextElementSibling.querySelector("p").textContent = lesson.recall;
}

function finish(k, firstTry) {
  if (!(k in saved.first)) saved.first[k] = firstTry;
  if (!saved.done.includes(k)) saved.done.push(k);
  store(); drawProgress(); drawLessons();
  const next = stepsEl.querySelector(".next");
  if (next) next.hidden = false;
}

const moveText = (n, cells, from, to) => `${num(n, cells, from)} hopper til ${sq(n, to)}`;

function show(k) {
  current = k; drawProgress();
  const steps = lesson.steps, s = steps[k], n = s.n, cells = s.cells.slice();
  stepsEl.innerHTML = "";
  const el = document.createElement("article"); el.className = "step";
  const label = s.type === "example" ? "Eksempel" : `Oppgave ${k} av ${steps.length - 1}`;
  el.innerHTML = `<p class="kind">${label}</p><h3></h3><p class="text"></p><div class="host"></div><p class="boardlabel"></p><div class="actions"></div><div class="feedback" aria-live="polite"></div>` +
    `<div class="actions"><button type="button" class="btn main next" hidden>${k === steps.length - 1 ? "Ferdig" : "Neste"}</button></div>`;
  const from = s.move ? at(n, s.move[0]) : -1, to = s.move ? at(n, s.move[1]) : -1;
  const mv = s.move ? moveText(n, cells, from, to) : "";
  el.querySelector("h3").textContent = s.title || {example: "Se hva som skjer", predict: k === 1 ? "Hva tror du?" : "Og her?",
    findTrap: "Finn fellen", findSafe: "Finn det trygge trekket"}[s.type];
  el.querySelector(".text").textContent = s.text || {
    example: `Se hva som skjer når ${mv}.`,
    predict: lesson.ask.replace("{move}", mv),
    findTrap: "Ett av trekkene her er en felle. Finn det. Trykk først på tallet som skal hoppe, og så på ruta det skal lande på.",
    findSafe: "Her er nesten alle trekk feller. Finn det ene trekket som ikke ødelegger brettet."}[s.type];
  stepsEl.append(el);
  const b = board(el.querySelector(".host"), n), label2 = el.querySelector(".boardlabel"), acts = el.querySelector(".actions"), fb = el.querySelector(".feedback");
  el.querySelector(".next").onclick = () => k < steps.length - 1 ? show(k + 1) : allDone();

  if (s.type === "example" || s.type === "predict") {
    const after = moved(cells, from, to), ok = solvable(after, n, new Map(), 500_000), e = ok ? null : explain(n, cells, from, to);
    label2.textContent = `Trekk: ${mv}`;
    const reveal = picked => {
      if (s.type === "example") {
        showResult(b, label2, n, cells, after, e);
        verdict(fb, "info", e ? e.head : "", e ? e.why : "", e ? e.steps : []);
        return finish(k, true);
      }
      let right;
      if (lesson.predict === "trap") right = picked === (ok ? "safe" : "trap");
      else {
        const answers = e ? ANSWERS[lesson.id](e, n, after) : [];
        right = answers.length ? answers.includes(picked) : picked === -1;
      }
      showResult(b, label2, n, cells, after, e, picked >= 0 ? {[picked]: "picked"} : {});
      verdict(fb, right ? "good" : "bad", right ? "Riktig!" : "Ikke helt.", e ? e.head + " " + e.why : lesson.none, e ? e.steps : []);
      recall(fb);
      finish(k, right);
    };
    if (s.type === "example") {
      b.draw(cells, {marks: {[from]: "from"}, arc: [from, to]});
      acts.innerHTML = `<button type="button" class="btn main">Spill trekket</button>`;
      acts.firstChild.onclick = () => { acts.innerHTML = ""; reveal(null); };
      return;
    }
    let choice = null;
    if (lesson.predict === "trap") {
      // Safe or a trap: answered with the two buttons, and the move is played at once.
      b.draw(cells, {marks: {[from]: "from"}, arc: [from, to]});
      acts.innerHTML = `<button type="button" class="btn">Trygt</button><button type="button" class="btn">Felle</button>`;
      const [safe, bad] = acts.children;
      safe.onclick = () => { acts.innerHTML = ""; reveal("safe"); };
      bad.onclick = () => { acts.innerHTML = ""; reveal("trap"); };
      return;
    }
    const pick = i => { choice = i; b.draw(cells, {marks: {[from]: "from", [i]: "picked"}, arc: [from, to], tap: pick}); none.setAttribute("aria-pressed", "false"); fb.className = "feedback"; fb.innerHTML = ""; };
    b.draw(cells, {marks: {[from]: "from"}, arc: [from, to], tap: pick});
    acts.innerHTML = `<button type="button" class="btn" aria-pressed="false">Ingen</button><button type="button" class="btn main">Spill trekket</button>`;
    const [none, go] = acts.children;
    none.onclick = () => { choice = -1; b.draw(cells, {marks: {[from]: "from"}, arc: [from, to], tap: pick}); none.setAttribute("aria-pressed", "true"); fb.className = "feedback"; fb.innerHTML = ""; };
    // Asked first: the answer is the point, so the move waits for one.
    go.onclick = () => choice == null ? verdict(fb, "info", "Svar først: trykk på et tall, eller velg «Ingen».") : (acts.innerHTML = "", reveal(choice));
    return;
  }

  // Find the trap, or the safe move: the player plays moves until the one asked for, and every other try is told.
  let selected = null, tries = 0;
  const goal = s.type;
  const redraw = () => {
    const marks = {};
    const arcs = selected == null ? null : targets(cells, n, selected).map(t => [selected, t]);
    if (selected != null) marks[selected] = "selected";
    b.draw(cells, {marks, arc: arcs, tap});
  };
  function tap(i) {
    if (selected != null && targets(cells, n, selected).includes(i)) return play(selected, i);
    selected = targets(cells, n, i).length ? i : null;
    if (selected == null) verdict(fb, "info", `${num(n, cells, i)} kan ikke hoppe noen steder nå.`);
    redraw();
  }
  function play(from, to) {
    tries++; selected = null;
    const after = moved(cells, from, to), ok = solvable(after, n, new Map(), 500_000);
    const move = `${num(n, cells, from)} til ${sq(n, to)}`, Move = move[0].toUpperCase() + move.slice(1);
    if (ok === null) { verdict(fb, "info", "Det trekket rakk vi ikke å sjekke. Prøv et annet."); return redraw(); }
    const e = ok ? null : explain(n, cells, from, to);
    // The move is shown as the explanation sees it, since that is what the words are about.
    showResult(b, label2, n, cells, after, e);
    if (goal === "findTrap" ? !ok : ok) {
      verdict(fb, "good", goal === "findTrap" ? "Riktig, det var fellen." : "Riktig, det trekket er trygt.",
        goal === "findTrap" ? (e ? e.head + " " + e.why : "") : "Brettet kan fortsatt løses etter det.", e ? e.steps : []);
      recall(fb);
      return finish(k, tries === 1);
    }
    if (goal === "findTrap") verdict(fb, "info", `${Move}: trygt.`, "Brettet kan fortsatt løses etter det trekket.");
    else verdict(fb, "bad", `${Move}: en felle.`, e ? e.head + " " + e.why : "Brettet kan ikke løses etter det.", e ? e.steps : []);
    acts.innerHTML = `<button type="button" class="btn">Prøv et annet trekk</button>`;
    acts.firstChild.onclick = () => { acts.innerHTML = ""; fb.className = "feedback"; fb.innerHTML = ""; label2.textContent = ""; redraw(); };
  }
  redraw();
}

function allDone() {
  const k = LESSONS.indexOf(lesson), next = LESSONS[k + 1];
  stepsEl.innerHTML = `<article class="step"><p class="kind">Leksjon ${k + 1}</p><h3>Ferdig!</h3><p></p><div class="actions"></div></article>`;
  // The example is no exercise, so it is not counted.
  const asked = lesson.steps.map((s, i) => i).filter(i => lesson.steps[i].type !== "example");
  const right = asked.filter(i => saved.first[i]).length;
  stepsEl.querySelector("p:not(.kind)").textContent = `Du fikk ${right} av ${asked.length} oppgaver riktig på første forsøk.` + (next ? "" : " Det var den siste leksjonen så langt.");
  const acts = stepsEl.querySelector(".actions");
  if (next) { acts.insertAdjacentHTML("beforeend", `<button type="button" class="btn main">Neste leksjon</button>`); acts.lastChild.onclick = () => { open(k + 1); scrollTo({top: 0}); }; }
  acts.insertAdjacentHTML("beforeend", `<button type="button" class="btn">Ta leksjonen på nytt</button>`);
  acts.lastChild.onclick = () => { saved.done = []; saved.first = {}; store(); drawLessons(); show(0); };
  current = lesson.steps.length; drawProgress();
}

const fromHash = Number((location.hash.match(/^#leksjon-(\d+)$/) || [])[1]) - 1;
open(LESSONS[fromHash] ? fromHash : Math.max(0, LESSONS.findIndex(l => !finished(l))));
</script>
</body>
</html>
